<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141012">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="صفحة صالح">
<title>صفحة صالح — جوجو</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="preload" href="../fonts/baloo-bhaijaan-2-arabic-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<!-- صفحة صالح المؤقتة (لين يُبنى Saleh OS). نفس دخول وألوان تطبيق جوجو، وبدون Service Worker:
     الـ SW حق جوجو (../sw.js) يخزن واجهتها هي، وتسجيله من هنا يخلط الكاشين. -->
<style>
@font-face{font-family:"Baloo";src:url(../fonts/baloo-bhaijaan-2-arabic-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Baloo";src:url(../fonts/baloo-bhaijaan-2-arabic-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Baloo";src:url(../fonts/baloo-bhaijaan-2-arabic-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Plex";src:url(../fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Plex";src:url(../fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Plex";src:url(../fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
/* ---- نفس ألوان ومقاسات تطبيق جوجو (jojo/index.html) ---- */
:root{
  color-scheme:dark;
  --choc:#141012; --cream:#1F191C; --card-2:#2A2226;
  --card-glass:rgba(31,25,28,.88); /* نفس تطبيق جوجو: بطاقات شفافة شوي يبين منها نقش البوسات */
  --pink:#F4A7C0; --pink-soft:#3A2630; --rose:#F4A7C0;
  --ink:#F6EEE3; --ink-2:#C7B4B9; --line:#33292D;
  --choc-deep:#C9AE8E; --on-pink:#1A1214;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --shadow:0 10px 28px -12px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.04) inset;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--choc);color:var(--ink);font-family:"Plex",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
/* نقش البوسات — منسوخ حرفيًا من jojo/index.html عشان الصفحتين عيلة وحدة */
html{overflow-x:clip;background-color:var(--choc);background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22220%22 height=%22220%22 viewBox=%220 0 220 220%22%3E%3Cg opacity=%22.32%22%3E%3Cg transform=%22translate(50 46) rotate(-18) scale(0.9) translate(-30 -22)%22%3E%3Cpath d=%22M4 22C10 12 20 8 30 14C40 8 50 12 56 22C46 20 38 21 30 21C22 21 14 20 4 22Z%22 fill=%22%23F4A7C0%22/%3E%3Cpath d=%22M4 23C14 23 22 23 30 23C38 23 46 23 56 23C50 36 38 40 30 40C22 40 10 36 4 23Z%22 fill=%22%23F4A7C0%22/%3E%3Cpath d=%22M6 22.2Q30 25.5 54 22.2%22 fill=%22none%22 stroke=%22%23C2557A%22 stroke-width=%222.2%22 stroke-linecap=%22round%22/%3E%3C/g%3E%3C/g%3E%3Cg opacity=%22.28%22%3E%3Cg transform=%22translate(160 72) rotate(24) scale(0.75) translate(-30 -22)%22%3E%3Cpath d=%22M4 22C10 12 20 8 30 14C40 8 50 12 56 22C46 20 38 21 30 21C22 21 14 20 4 22Z%22 fill=%22%23F4A7C0%22/%3E%3Cpath d=%22M4 23C14 23 22 23 30 23C38 23 46 23 56 23C50 36 38 40 30 40C22 40 10 36 4 23Z%22 fill=%22%23F4A7C0%22/%3E%3Cpath d=%22M6 22.2Q30 25.5 54 22.2%22 fill=%22none%22 stroke=%22%23C2557A%22 stroke-width=%222.2%22 stroke-linecap=%22round%22/%3E%3C/g%3E%3C/g%3E%3Cg opacity=%22.31%22%3E%3Cg transform=%22translate(98 152) rotate(9) scale(0.85) translate(-30 -22)%22%3E%3Cpath d=%22M4 22C10 12 20 8 30 14C40 8 50 12 56 22C46 20 38 21 30 21C22 21 14 20 4 22Z%22 fill=%22%23F4A7C0%22/%3E%3Cpath d=%22M4 23C14 23 22 23 30 23C38 23 46 23 56 23C50 36 38 40 30 40C22 40 10 36 4 23Z%22 fill=%22%23F4A7C0%22/%3E%3Cpath d=%22M6 22.2Q30 25.5 54 22.2%22 fill=%22none%22 stroke=%22%23C2557A%22 stroke-width=%222.2%22 stroke-linecap=%22round%22/%3E%3C/g%3E%3C/g%3E%3Cg opacity=%22.27%22%3E%3Cg transform=%22translate(188 188) rotate(-32) scale(0.7) translate(-30 -22)%22%3E%3Cpath d=%22M4 22C10 12 20 8 30 14C40 8 50 12 56 22C46 20 38 21 30 21C22 21 14 20 4 22Z%22 fill=%22%23F4A7C0%22/%3E%3Cpath d=%22M4 23C14 23 22 23 30 23C38 23 46 23 56 23C50 36 38 40 30 40C22 40 10 36 4 23Z%22 fill=%22%23F4A7C0%22/%3E%3Cpath d=%22M6 22.2Q30 25.5 54 22.2%22 fill=%22none%22 stroke=%22%23C2557A%22 stroke-width=%222.2%22 stroke-linecap=%22round%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");background-size:220px 220px;background-attachment:fixed}
@media (prefers-contrast:more),(prefers-reduced-transparency:reduce){html{background-image:none}}
::selection{background:var(--pink);color:var(--on-pink)}
body{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 18px) 18px 120px;max-width:440px;margin:0 auto}
body.bare{padding-bottom:40px}
h1,h2,h3,.num{font-family:"Baloo","Plex",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px;border-radius:12px}
#view:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* الترويسة + شارة "صفحة صالح" */
.page-top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.page-top h1{font-size:28px;font-weight:800;flex:1;line-height:1.15}
.page-top p{color:var(--ink-2);font-size:14px;margin-top:2px;font-family:"Plex"}
.owner{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--card-2);color:var(--choc-deep);border:1px solid #4A3D33}
.owner svg{width:14px;height:14px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--choc-deep);background:var(--cream);border:1.5px solid var(--line);flex:none}
.icon-btn svg{width:22px;height:22px}
.icon-btn[disabled]{opacity:.35;cursor:default}
.cat{width:64px;height:64px;flex:none}

/* السوارة */
.bracelet{background:var(--pink-soft);border-radius:var(--r-lg);padding:18px 18px 16px;margin-bottom:22px}
.bracelet-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.bracelet-head h2{font-size:18px;font-weight:700}
.bracelet-head .num{font-size:34px;font-weight:800;color:var(--rose);font-variant-numeric:tabular-nums}
.bracelet .hint{font-size:13px;color:var(--ink-2);margin-top:10px;line-height:1.7}
.beads{--b:19px;display:flex;flex-wrap:nowrap;justify-content:space-between;gap:3px;align-items:center;position:relative;padding:6px 2px}
.beads::before{content:"";position:absolute;inset-inline:0;top:50%;height:2px;background:var(--choc-deep);opacity:.55;border-radius:2px}
.bead{position:relative;width:var(--b);height:var(--b);flex:none;border-radius:50%;background:var(--choc);border:2px solid #5A3B48}
.bead.on,.bead.high{background:radial-gradient(circle at 35% 30%,#FFE3EC 0 18%,var(--pink) 45%,#E98BAA 100%);border-color:#E98BAA}
.bead.mid{background:radial-gradient(circle at 35% 30%,#E9C3CF 0 14%,#A8667E 60%,#8A4D64 100%);border-color:#8A4D64}
.bead.low{background:#4A3A40;border-color:#6B5A60}
.bead.none{background:transparent;border:2px dashed #6B4A58}
.bead.charm{width:26px;height:26px;border:0;background:none}
.yday{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink-2);margin-top:4px}
.yday b{color:var(--ink);font-family:"Baloo";font-size:18px;font-weight:700}

/* آخر ٧ أيام */
.week{display:flex;justify-content:space-between;position:relative;padding:4px 0 2px}
.week::before{content:"";position:absolute;inset-inline:6%;top:38px;height:2px;background:var(--choc-deep);opacity:.55;border-radius:2px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0;font-size:12px;color:var(--ink-2)}
.wd .bead{--b:28px}
.wd .p{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.wd.today .d{color:var(--rose);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .bead{--b:12px;border-width:1.5px}

/* أقسام وبطاقات */
h2.sec{font-size:19px;font-weight:700;margin:4px 4px 10px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--choc-deep);flex:none}
.card{background:var(--card-glass);border:1.5px solid var(--line);border-radius:var(--r-md);padding:18px;margin-bottom:16px}
.card h3{font-size:18px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .ic{width:22px;height:22px;flex:none;color:var(--choc-deep)}
.muted{color:var(--ink-2);font-size:14px;line-height:1.7}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.stat{background:var(--card-glass);border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px;display:block;text-decoration:none;color:inherit}
.stat .num{font-size:30px;font-weight:800;color:var(--rose);line-height:1.1}
.stat .l{font-size:13px;color:var(--ink-2);margin-top:2px;line-height:1.6}
a.stat:active{background:var(--card-2)}
.group{background:var(--card-glass);border:1.5px solid var(--line);border-radius:var(--r-md);margin-bottom:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px;width:100%;text-align:start}
.row+.row,.sub+.row{border-top:1px solid var(--line)}
.row .ic{width:26px;height:26px;flex:none;color:var(--choc-deep)}
.row .t{flex:1;font-size:16px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--ink-2);font-weight:400}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid #5C4A50;display:grid;place-items:center;flex:none}
.tick svg{width:16px;height:16px;opacity:0}
.row.done .tick{background:var(--pink);border-color:var(--pink)}
.row.done .tick svg{opacity:1}
.prayers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 14px 16px}
.pr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 4px;min-height:64px;border-radius:var(--r-sm);background:var(--card-2);font-size:13px}
.pr b{font-weight:600;font-size:14px}
.pr span{color:var(--choc-deep);font-variant-numeric:tabular-nums}
.pr.done{background:var(--pink)}
.pr.done,.pr.done b{color:var(--on-pink)}
.pr.done span{color:#3A2630}
.sub{padding:4px 16px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:6px 14px;border-radius:999px;background:var(--card-2);border:1.5px solid #4A3D42;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.done{background:var(--pink);border-color:var(--pink);color:var(--on-pink);font-weight:600}
.cups{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 14px}
.cup{width:22px;height:28px}
.cup path{fill:var(--card-2);stroke:#5C4A50;stroke-width:2}
.cup path.w{fill:transparent;stroke:none}
.cup.full path.w{fill:#8FC6E3}
.cup.full path.o{stroke:#8FC6E3}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px;align-items:baseline}
.kv dt{color:var(--ink-2);font-size:13px}
.kv dd{overflow-wrap:anywhere}
.ro{font-size:12px;color:var(--ink-2);text-align:center;margin:-8px 0 16px}

.btn{min-height:48px;padding:12px 22px;border-radius:999px;background:var(--pink);color:var(--on-pink);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid #4A3D42}
.btn.small{min-height:44px;padding:8px 16px;font-size:14px}
.link{color:var(--rose);text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;font-family:"Plex";background:var(--card-2);color:var(--ink-2);border:1px solid #4A3D42}
.badge.seen{background:var(--pink-soft);color:var(--rose);border-color:#5A3B48}
.badge.new{background:var(--pink);color:var(--on-pink);border-color:var(--pink)}
label.f{display:block;font-size:14px;color:var(--ink-2);margin:14px 2px 6px}
.in,textarea.in{width:100%;min-height:48px;padding:12px 14px;border-radius:var(--r-sm);background:var(--card-2);border:1.5px solid #4A3D42;font-size:16px;color:var(--ink)}
textarea.in{min-height:110px;resize:vertical;line-height:1.7}
.in::placeholder{color:#9C8A90}
.in:focus{border-color:var(--rose);outline:none}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.status{font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.6}

/* رسالة اليوم: ظرف */
.letter{position:relative;background:var(--card-glass);border:1.5px solid #4A3D33;border-radius:var(--r-lg);padding:22px 18px 18px;box-shadow:var(--shadow);margin-bottom:22px}
.letter .bow{position:absolute;top:-16px;inset-inline-start:22px;width:46px;height:30px}

/* رسائل التشجيع */
.win{background:var(--card-glass);border:1.5px solid var(--line);border-radius:var(--r-md);padding:16px;margin-bottom:12px}
.win-head{display:flex;gap:12px;align-items:flex-start}
.win .medal{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--card-2);color:var(--choc-deep)}
.win .medal .ic{width:24px;height:24px}
.win.open{border-color:#5A3B48;background:linear-gradient(180deg,#2A1C23,var(--cream) 60%)}
.win.open .medal{background:var(--pink);color:var(--on-pink)}
.win h3{font-size:17px;font-weight:700}
.win textarea.in{min-height:90px;margin-top:12px}

/* نوتها */
.note{background:var(--card-glass);border:1.5px solid var(--line);border-radius:var(--r-md);margin-bottom:10px;overflow:hidden}
.note.unread{border-color:#5A3B48;background:linear-gradient(180deg,#2A1C23,var(--cream))}
.note>button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:14px 16px;min-height:56px}
.note>button .ic{width:24px;height:24px;color:var(--choc-deep);flex:none}
.note .pv{flex:1;min-width:0}
.note .pv b{display:block;font-size:15px;font-weight:600}
.note .pv span{display:block;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note .body{padding:0 16px 14px;font-size:16px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.note .meta{padding:0 16px 14px;font-size:12px;color:var(--ink-2)}

/* ذوقها */
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bean{background:var(--card-glass);border:1.5px solid var(--line);border-radius:var(--r-md);padding:8px;min-width:0}
.bean .ph{display:block;width:100%;aspect-ratio:3/4;border-radius:14px;background:var(--card-2);object-fit:cover}
.bean .n{font-size:15px;font-weight:600;margin-top:8px;overflow-wrap:anywhere}
.bean .rs{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.bean .lk{font-size:13px;margin-top:4px;color:var(--ink)}
.bean .chips{gap:4px;margin-top:6px}
.tag{display:inline-flex;align-items:center;min-height:28px;padding:2px 10px;border-radius:999px;background:var(--pink-soft);color:var(--rose);border:1px solid #5A3B48;font-weight:600;font-size:13px}
.tag.no{background:var(--card-2);color:var(--ink-2);border-color:#4A3D42}
.taste{display:flex;flex-direction:column;gap:10px}
.taste .line{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}

/* الدخول والحالات */
.login{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;justify-content:center}
.login .cat{width:96px;height:96px;margin:0 auto 10px;display:block}
.login h1{font-size:32px;font-weight:800;text-align:center}
.login .lead{text-align:center;color:var(--ink-2);margin:6px 0 18px}
.login .owner{align-self:center;margin-bottom:12px}
.alert{border-radius:var(--r-sm);padding:12px 14px;font-size:14px;line-height:1.6;margin-top:12px;background:#3A1F28;border:1px solid #6B3446;color:#FFD9E5}
.alert.soft{background:var(--card-2);border-color:#4A3D42;color:var(--ink);margin:0 0 16px}
.empty{text-align:center;padding:26px 18px;border:1.5px dashed var(--line);border-radius:var(--r-md);color:var(--ink-2);font-size:15px;line-height:1.8;margin-bottom:16px}
.loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:60px 0;color:var(--ink-2);text-align:center}
.loading .cat{animation:breathe 1.6s ease-in-out infinite}
.toast{position:fixed;inset-inline:18px;bottom:calc(env(safe-area-inset-bottom) + 92px);max-width:404px;margin:0 auto;background:var(--ink);color:var(--choc);padding:12px 16px;border-radius:16px;font-size:15px;font-weight:500;box-shadow:var(--shadow);z-index:30;animation:rise .3s var(--ease)}
.foot{font-size:12px;color:var(--ink-2);text-align:center;margin-top:8px}
@keyframes breathe{50%{transform:scale(1.06)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

nav.tabs{position:fixed;inset-inline:0;bottom:0;padding:8px 4px calc(env(safe-area-inset-bottom) + 8px);background:rgba(20,16,18,.94);backdrop-filter:saturate(1.2) blur(8px);border-top:1.5px solid var(--line);z-index:20}
nav.tabs ul{display:flex;justify-content:space-around;list-style:none;max-width:440px;margin:0 auto}
nav.tabs li{flex:1;min-width:0;display:flex;justify-content:center}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink-2);text-decoration:none;padding:4px 2px;width:100%;max-width:72px;min-height:48px;border-radius:14px;white-space:nowrap;position:relative}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a[aria-current]{color:var(--rose);background:var(--pink-soft);font-weight:600}
nav.tabs .dot{position:absolute;top:2px;inset-inline-end:14px;width:8px;height:8px;border-radius:50%;background:var(--pink)}
</style>
</head>
<body>
<main id="view" tabindex="-1"></main>

/* ============================================================ الجلسة (نفس تطبيق جوجو: fetch مباشر لـ Supabase Auth) */
function NetError(msg) { this.name = 'NetError'; this.message = msg || 'offline'; }
function HttpError(status, body) { this.name = 'HttpError'; this.status = status; this.message = body; }
function AuthError(msg) { this.name = 'AuthError'; this.message = msg; }
function isOffline(e) { return e instanceof NetError && (e.message === 'offline' || e.message === 'refresh_unreachable'); }

var Auth = {
  sess: null,
  load: function () { this.sess = LS.get('session', null); return !!(this.sess && this.sess.access_token); },
  save: function (s) {
    if (!s.expires_at) s.expires_at = Math.floor(Date.now() / 1000) + (s.expires_in || 3600);
    this.sess = s; LS.set('session', s);
  },
  uid: function () { return this.sess && this.sess.user && this.sess.user.id; },
  signIn: async function (email, password) {
    var r;
    try {
      r = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
        method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      });
    } catch (e) { throw new NetError(); }
    if (!r.ok) {
      var b = {}; try { b = await r.json(); } catch (e) { /* not json */ }
      var code = b.error_code || b.error || '';
      if (r.status === 429) throw new AuthError('rate_limited');
      if (r.status === 400 || code === 'invalid_credentials' || code === 'invalid_grant') throw new AuthError('bad_credentials');
      throw new AuthError('auth_' + r.status);
    }
    this.save(await r.json());
  },
  /* فشل نهائي بس (الرمز نفسه مرفوض) يطلّعه؛ أي شي ثاني مؤقت. طلب تحديث واحد بنفس الوقت. */
  _refreshing: null,
  refresh: function () {
    var self = this;
    if (!self._refreshing) {
      self._refreshing = self._doRefresh().then(function (v) { self._refreshing = null; return v; }, function (e) { self._refreshing = null; throw e; });
    }
    return self._refreshing;
  },
  _doRefresh: async function () {
    if (!this.sess || !this.sess.refresh_token) throw new AuthError('expired');
    var r, ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctl && setTimeout(function () { ctl.abort(); }, 15000);
    try {
      r = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: this.sess.refresh_token }), signal: ctl ? ctl.signal : undefined
      });
    } catch (e) { throw new NetError('refresh_unreachable'); }
    finally { if (timer) clearTimeout(timer); }
    if (r.ok) return this.save(await r.json());
    var text = ''; try { text = await r.text(); } catch (e) { /* ignore */ }
    if ((r.status === 400 || r.status === 401) && /invalid_grant|refresh_token_not_found|refresh_token_already_used|session_not_found|session_expired/.test(text)) throw new AuthError('expired');
    throw new NetError('refresh_' + r.status);
  },
  token: async function () {
    if (!this.sess) throw new AuthError('expired');
    if (this.sess.expires_at && this.sess.expires_at - 60 < Date.now() / 1000) await this.refresh();
    return this.sess.access_token;
  },
  signOut: async function () {
    var s = this.sess; this.sess = null;
    stopBackground();
    LS.del('session');
    if (s && s.access_token && !DEMO) {
      try { await fetch(SB_URL + '/auth/v1/logout', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + s.access_token } }); } catch (e) { /* offline: the token just expires */ }
    }
  }
};

async function api(path, opt, retried) {
  opt = opt || {};
  var h = { apikey: SB_KEY, Authorization: 'Bearer ' + await Auth.token(), 'Content-Type': 'application/json' };
  if (opt.prefer) h.Prefer = opt.prefer;
  var r;
  try {
    r = await fetch(SB_URL + path, { method: opt.method || 'GET', headers: h, body: opt.body !== undefined ? JSON.stringify(opt.body) : undefined });
  } catch (e) { throw new NetError(); }
  if (r.status === 401) {
    if (retried) throw new AuthError('expired');     // ٤٠١ حتى بعد تحديث ناجح = الجلسة منتهية → شاشة الدخول
    await Auth.refresh(); return api(path, opt, true);
  }
  if (r.status >= 500 || r.status === 429 || r.status === 408) throw new NetError('http_' + r.status);
  if (!r.ok) throw new HttpError(r.status, await r.text());
  var t = await r.text(); return t ? JSON.parse(t) : null;
}
function q(v) { return encodeURIComponent(v); }

/* إعادة محاولة تلقائية بتأخير متزايد لما يفشل التحميل بسبب النت (٥ ثواني ← ٥ دقايق) */
var retryTimer = null, backoff = 0;
function scheduleRetry() {
  clearTimeout(retryTimer);
  backoff = Math.min(backoff ? backoff * 2 : 5000, 300000);
  retryTimer = setTimeout(function () { if (S.role) { clearErrors(); render(); } }, backoff);
}
function clearErrors() { S.herErr = S.homeErr = S.msgsErr = S.winsErr = S.lettersErr = S.tasteErr = false; S.day.err = false; }
function stopBackground() { clearTimeout(retryTimer); retryTimer = null; backoff = 0; loadGen++; }
async function guard(fn, errKey) {
  var gen = loadGen;
  try { await fn(); if (gen === loadGen) backoff = 0; }
  catch (e) {
    if (gen !== loadGen) return;
    if (e instanceof AuthError) return sessionExpired();
    if (errKey === 'day') S.day.err = true; else S[errKey] = true;
    if (e instanceof NetError) scheduleRetry();
  }
  if (gen === loadGen && S.role) render();
}

/* ============================================================ رسائل التشجيع */
function loadWins() {
  return guard(async function () {
    if (!S.her) await loadHer();
    if (!S.msgs) await loadMsgsRaw();
    /* نفس حسبة تطبيقها: اللي محفوظ بإعداداتها + اللي ينفتح من آخر ٦٠ يوم */
    var from = addDays(S.today, -59), rows = await store.checks(from, S.today), by = {}, days = [], s = S.her.settings;
    (rows || []).forEach(function (c) { (by[c.date] = by[c.date] || {})[c.key] = c.value; });
    for (var d = from; d <= S.today; d = addDays(d, 1)) days.push({ date: d, items: Jojo.requiredItems(s, tasksOn(d), d), checks: by[d] || {}, waterGoal: s.waterGoal });
    var kept = s.wins || [], un = Jojo.unlocked(days);
    S.wins = { unlocked: kept.concat(un.filter(function (k) { return kept.indexOf(k) === -1; })) };
  }, 'winsErr');
}
async function loadMsgsRaw() {
  var t = S.today, r = await Promise.all([store.dailyMsgs([t, addDays(t, 1)]), store.winMsgs()]);
  var daily = {}, wins = {};
  (r[0] || []).forEach(function (m) { if (!daily[m.for_date]) daily[m.for_date] = m; });   // الأحدث أول (نفس اللي تشوفه هي)
  (r[1] || []).forEach(function (m) { if (!wins[m.achievement]) wins[m.achievement] = m; });
  S.msgs = { daily: daily, wins: wins };
}
function renderWins() {
  var top = head('رسائل التشجيع', 'تنفتح لها رسالتك لما توصل الإنجاز');
  if (S.winsErr || S.msgsErr) return paint(top + errBox('ما قدرت أجيب الإنجازات.'));
  if (!S.wins || !S.msgs) { loadWins(); return paint(top + loadingBox()); }
  var un = S.wins.unlocked;
  var list = Jojo.ACHIEVEMENTS.map(function (id) {
    var info = WIN_INFO[id] || { icon: 'bow', title: id, how: '' }, m = S.msgs.wins[id], open = un.indexOf(id) !== -1;
    var state = open ? (m ? (m.seen_at ? '<span class="badge seen">انفتح ✓ وشافت رسالتك · ' + whenLabel(m.seen_at) + '</span>' : '<span class="badge seen">انفتح ✓ لسه ما شافت رسالتك</span>') : '<span class="badge new">انفتح ✓ وما فيه رسالة! اكتب لها</span>')
      : (m ? '<span class="badge">مقفل — رسالتك تنتظرها</span>' : '<span class="badge">مقفل — ما كتبت رسالة لسه</span>');
    return '<article class="win' + (open ? ' open' : '') + '" data-win="' + esc(id) + '"><div class="win-head"><div class="medal" aria-hidden="true">' + (open ? IC[info.icon] : IC.lock) + '</div>' +
      '<div style="flex:1;min-width:0"><h3>' + esc(info.title) + '</h3><p class="muted">' + esc(info.how) + '</p><div style="margin-top:6px">' + state + '</div></div></div>' +
      msgForm('achievement', id, id, m, 'رسالة ' + info.title, 'اكتب لها لما توصل…', 'احفظها') + '</article>';

/* حفظ رسالة: موجودة ← PATCH للنص، مو موجودة ← POST. قبل الـ POST نتأكد من الخادم عشان ما تتكرر. */
async function saveMsg(form) {
  var kind = form.dataset.kind, slot = form.dataset.slot, dk = kind + ':' + slot, body = form.body.value.trim(), btn = form.querySelector('button');
  if (!body) { toast('اكتب شي أول ✍️'); form.body.focus(); return; }
  if (kind === 'achievement' && Jojo.ACHIEVEMENTS.indexOf(slot) === -1) return;
  if (kind === 'daily' && slot !== 'today' && slot !== 'tomorrow') return;
  S.drafts[dk] = form.body.value;
  /* التاريخ ينحسب الحين (توقيت الرياض)، مو من "اليوم" المحفوظ — لو عدّت الساعة ١٢ وهو يكتب، تروح لليوم الجديد */
  var now = todayISO(), rolled = false;
  if (now !== S.today) { rolled = kind === 'daily'; rollDay(now); }
  var key = kind === 'daily' ? (slot === 'today' ? now : addDays(now, 1)) : slot;
  btn.disabled = true;
  try {
    if (!S.msgs) await loadMsgsRaw();
    var bag = kind === 'daily' ? S.msgs.daily : S.msgs.wins, cur = bag[key];
    if (cur && cur.body === body) { btn.disabled = false; delete S.drafts[dk]; toast('ما تغيّر شي'); return; }
    if (!cur) {
      var fresh = kind === 'daily' ? await store.dailyMsgs([key]) : (await store.winMsgs()).filter(function (m) { return m.achievement === key; });
      cur = (fresh || [])[0] || null;
    }
    var saved = cur ? await store.editMsg(cur.id, body) : await store.addMsg(kind === 'daily' ? { kind: 'daily', for_date: key, body: body } : { kind: 'achievement', achievement: key, body: body });
    bag[key] = saved || Object.assign({}, cur, { body: body, seen_at: null });
    if (S.home && kind === 'daily' && key === S.today) S.home.msg = bag[key];
    delete S.drafts[dk];
    if (kind === 'daily') S.rollNotice = false;
    render();
    toast(kind === 'daily' ? (rolled ? 'الساعة عدّت ١٢ — انحفظت لليوم الجديد 💌' : key === S.today ? 'وصلت لها 💌' : 'تجدولت لبكرة 💌') : 'انحفظت، تنفتح لها لما توصل 🎀');
  } catch (e) {
    btn.disabled = false;
    if (e instanceof AuthError) return sessionExpired();
    toast(isOffline(e) ? 'النت مقطوع، جرب لما يرجع' : 'ما انحفظت، جرب مرة ثانية');
  }
}

  var fav = null, best = 1;

      '<div class="line">تحب: ' + (p.likes.length ? p.likes.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') : 'لسه ما بان') + '</div>' +
      (p.dislikes.length ? '<div class="line">ما تحب: ' + p.dislikes.map(function (t) { return '<span class="tag no">' + esc(t) + '</span>'; }).join('') + '</div>' : '') +
      (fav ? '<div class="line">كيسها المفضل: <b style="color:var(--ink)">' + esc(beanName(fav)) + '</b></div>' : '') + '</div>';
  var grid = S.beans.length ? '<div class="shelf" id="shelf">' + S.beans.map(function (b) {
    var of = rs.filter(function (r) { return r.bean_id === b.id; }), liked = of.filter(function (r) { return r.liked === true; }).length;
    var counts = {}, order = [];
    of.forEach(function (r) { (r.notes || []).forEach(function (n) { if (!counts[n]) { counts[n] = 0; order.push(n); } counts[n]++; }); });
    var u = S.urls[b.photo_path];
    var meta = [b.roaster, b.origin, b.process, b.roast].filter(Boolean).map(esc).join(' · ');
    return '<figure class="bean"><img class="ph" alt="كيس ' + esc(beanName(b)) + '"' + (u ? ' src="' + esc(u) + '"' : '') + ' loading="lazy">' +
      '<figcaption><div class="n">' + esc(beanName(b)) + '</div>' + (meta ? '<div class="rs">' + meta + '</div>' : '') +
      '<div class="lk">' + (of.length ? '👍 عجبها ' + ar(liked) + ' من ' + ar(of.length) : 'ما قيّمته لسه') + '</div>' +
      (order.length ? '<div class="chips">' + order.map(function (n) { return '<span class="tag">' + esc(n) + (counts[n] > 1 ? ' ×' + ar(counts[n]) : '') + '</span>'; }).join('') + '</div>' : '') +
      '</figcaption></figure>';
  }).join('') + '</div>' : '<p class="empty">ما صوّرت أكياس لسه ☕</p>';
  paint(top + '<h2 class="sec">ملخص ذوقها</h2><section class="card" aria-label="ملخص ذوقها">' + sum + '</section>' + recipesBlock() + '<h2 class="sec">أكياسها</h2>' + grid);
}

/* ============================================================ الأحداث */
document.addEventListener('click', function (ev) {
  var b = ev.target.closest && ev.target.closest('[data-act]'); if (!b || !S.role) return;
  var act = b.dataset.act;
  if (act === 'retry') { clearTimeout(retryTimer); backoff = 0; clearErrors(); render(); }
  else if (act === 'letter') openLetter(b.dataset.id);
  else if (act === 'day-prev' || act === 'day-next') {
    var d = addDays(S.day.date || S.today, act === 'day-prev' ? -1 : 1);
    if (d > S.today) return;
    S.day = { date: d, checks: {}, err: false, loaded: false }; render();
  }
  else if (act === 'signout') { Auth.signOut().then(function () { location.hash = ''; showLogin(); }); }
});
document.addEventListener('input', function (ev) { var t = ev.target; if (t.matches && t.matches('textarea[data-draft]')) S.drafts[t.dataset.draft] = t.value; });
document.addEventListener('submit', function (ev) {
  var f = ev.target;
  if (f.getAttribute('data-form') === 'msg') { ev.preventDefault(); if (S.role) saveMsg(f); }
});
window.addEventListener('hashchange', function () { if (S.role) go(); });
/* رجع للصفحة أو تغيّر اليوم: نجيب الجديد */
/* اليوم تغيّر (نص الليل): نحدّث التاريخ ونرمي اللي مرتبط باليوم القديم. المسودات تبقى. */
function rollDay(t) {
  S.today = t; S.msgs = null; S.home = null; S.wins = null; S.day = { date: null, checks: {}, err: false };
  if (Object.keys(S.drafts).some(function (k) { return k.indexOf('daily:') === 0 && String(S.drafts[k]).trim(); })) S.rollNotice = true;
}
function refreshAll() {
  if (!S.role) return;
  var t = todayISO();
  if (t !== S.today) rollDay(t);
  S.home = null; S.letters = null; S.wins = null; S.msgs = null; S.her = null; S.tasks = null; S.beans = null; S.ratings = null; S.recipes = null;
  if (S.day.date) S.day.loaded = false;
  clearErrors(); render();
}
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refreshAll(); });
window.addEventListener('focus', function () { if (S.role && todayISO() !== S.today) refreshAll(); });
setInterval(function () { if (S.role && todayISO() !== S.today) refreshAll(); }, 60000);
window.addEventListener('online', function () { if (S.role) { backoff = 0; clearErrors(); render(); } });

/* ============================================================ الدخول */
function latinDigits(v) {
  return String(v == null ? '' : v).replace(/[٠-٩]/g, function (d) { return String(d.charCodeAt(0) - 0x0660); })
    .replace(/[۰-۹]/g, function (d) { return String(d.charCodeAt(0) - 0x06F0); });
}
function usernameToEmail(u) {
  u = latinDigits(u).trim().toLowerCase();
  if (!u) return '';
  return u.indexOf('@') === -1 ? u + '@jojo.invalid' : u;
}
function resetState() {
  S.role = null; S.her = S.tasks = S.home = S.msgs = S.wins = S.letters = S.beans = S.ratings = null;
  S.urls = {}; S.urlsExp = 0; S.open = {}; S.drafts = {}; S.rollNotice = false; S.day = { date: null, checks: {}, err: false }; clearErrors();
}
function showLogin(errMsg) {
  resetState();
  $('#tabs').hidden = true; document.body.classList.add('bare');
  $('#view').innerHTML =
    '<section class="login"><form data-login novalidate style="display:flex;flex-direction:column">' + OWNER + catSVG() + '<h1>هلا صالح</h1><p class="lead">سجّل دخولك عشان تشوف جوجو وتكتب لها</p>' +
    '<label class="f" for="em">اسم المستخدم</label><input id="em" class="in" type="text" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr" required>' +
    '<label class="f" for="pw">كلمة المرور</label><input id="pw" class="in" type="password" name="password" autocomplete="current-password" dir="ltr" required>' +
    '<div class="actions"><button class="btn block" id="loginBtn">دخول</button></div>' +
    '<div id="loginErr" role="alert">' + (errMsg ? '<p class="alert">' + esc(errMsg) + '</p>' : '') + '</div></form></section>';
}
document.addEventListener('submit', async function (ev) {
  var f = ev.target; if (!f.hasAttribute('data-login')) return;
  ev.preventDefault();
  var email = usernameToEmail(f.username.value), pw = latinDigits(f.password.value), err = $('#loginErr'), btn = $('#loginBtn');
  if (!email || !pw) { err.innerHTML = '<p class="alert">اكتب اسم المستخدم وكلمة المرور</p>'; return; }
  btn.disabled = true; btn.textContent = 'لحظة…'; err.innerHTML = '';
  try { await Auth.signIn(email, pw); await start(); }
  catch (e) {
    btn.disabled = false; btn.textContent = 'دخول';
    err.innerHTML = '<p class="alert">' + (isOffline(e) ? 'النت مقطوع، جرب لما يرجع' : e.message === 'rate_limited' ? 'محاولات كثير ورا بعض، استنى دقيقة وجرب' : e.message === 'bad_credentials' ? 'اسم المستخدم أو كلمة المرور غلط' : 'صار شي غلط، جرب بعد شوي') + '</p>';
  }
});
async function sessionExpired() {
  await Auth.signOut();
  showLogin('انتهت الجلسة، سجّل دخولك مرة ثانية');
}

/* ============================================================ التشغيل */
var bootTimer = null, bootTry = 0;
async function start() {
  clearTimeout(bootTimer);
  if (!Auth.sess) return;
  $('#view').innerHTML = loadingBox();
  try {
    var role = await store.myRole();
    if (role !== 'saleh') {                     // جوجو (أو أي حساب ثاني) ما تفتح صفحة صالح
      await Auth.signOut();
      return showLogin('هذي الصفحة لصالح');
    }
    bootTry = 0;
    S.role = 'saleh'; S.today = todayISO();
    go();
  } catch (e) {
    if (e instanceof AuthError) return sessionExpired();
    $('#view').innerHTML = '<div class="loading" role="alert">' + catSVG() + '<p>' + (isOffline(e) ? 'النت مقطوع. بجرب مرة ثانية أول ما يرجع.' : 'ما قدرت أفتح الصفحة، بجرب بعد شوي.') + '</p><button class="btn small" onclick="location.reload()">جرب الحين</button></div>';
    bootTimer = setTimeout(start, Math.min(5000 * Math.pow(2, bootTry++), 300000));
  }
}
function loadScript(src) {
  return new Promise(function (res, rej) {
    var sc = document.createElement('script'); sc.src = src; sc.async = true; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
  });
}
function boot() {
  if (!window.Jojo || !Jojo.ACHIEVEMENTS) { $('#view').innerHTML = '<p class="alert">ما قدرت أحمّل الصفحة، حدّثها.</p>'; return; }
  loadScript('../vendor/adhan.umd.min.js?v=' + V).then(function () {
    if (!window.adhan) return;
    Jojo.useAdhan(window.adhan);
    if (S.role && route === 'day') render();
  }).catch(function () { /* أوقات الأذان تطلع "—" */ });
  if (DEMO) {
    store = makeDemo();
    Auth.sess = { access_token: 'demo', user: { id: 'demo-saleh' } };
    return start();
  }
  store = Remote;
  if (Auth.load()) start(); else showLogin();
}
/* core.js يتحمل دايمًا طازج (Cache-Control: no-cache = يتأكد من الخادم كل مرة، ٣٠٤ لو ما تغيّر)،
   ورقم النسخة ناخذه منه هو (Jojo.CORE_VERSION) لـ ../vendor/ — كذا ما يصير فيه رقم يدوي ينسى أحد يحدّثه. */
function loadCore() {
  return new Promise(function (res, rej) {
    var x = new XMLHttpRequest();
    x.open('GET', '../core.js');
    x.setRequestHeader('Cache-Control', 'no-cache');
    x.onload = function () { if (x.status >= 200 && x.status < 300) res(x.responseText); else rej(new Error('core ' + x.status)); };
    x.onerror = function () { rej(new Error('core offline')); };
    x.send();
  }).then(function (code) {
    var sc = document.createElement('script'); sc.textContent = code + '\n//# sourceURL=core.js';
    document.head.appendChild(sc);
    if (!window.Jojo) throw new Error('core');
    V = String(Jojo.CORE_VERSION || '0');
    window.SalehApp.version = V;
  });
}
loadCore().then(boot, function () {
  $('#view').innerHTML = '<div class="loading" role="alert">' + catSVG() + '<p>ما قدرت أحمّل الصفحة، تأكد من النت وحدّثها.</p><button class="btn small" onclick="location.reload()">حدّث</button></div>';
});
})();
</script>
