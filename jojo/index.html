@font-face{font-family:"Baloo";src:url(fonts/baloo-bhaijaan-2-arabic-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Baloo";src:url(fonts/baloo-bhaijaan-2-arabic-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Baloo";src:url(fonts/baloo-bhaijaan-2-arabic-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}

/* ---- الألوان والمقاسات: نفس النموذج المعتمد jojo/proto/today.html ---- */
:root{
  color-scheme:dark;
  --choc:#141012;      /* أسود دافي — الأرضية */
  --cream:#1F191C;     /* البطاقات */
  --card-glass:rgba(31,25,28,.88); /* بطاقات شفافة شوي يبين منها نقش البوسات */
  --card-2:#2A2226;    /* عناصر داخل البطاقات */
  --pink:#F4A7C0;      /* الوردي الأساسي */
  --pink-soft:#3A2630; /* أرضية وردية داكنة للسوارة */
  --rose:#F4A7C0;      /* لمسات وردية على الداكن (تباين 9:1) */
  --ink:#F6EEE3;       /* وايت شوكلت — النص */
  --ink-2:#C7B4B9;     /* نص ثانوي مايل للوردي (تباين 8:1) */
  --line:#33292D;
  --choc-deep:#C9AE8E; /* وايت شوكلت غامق — لمسات بسيطة */
  --on-pink:#1A1214;   /* نص فوق الوردي */
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --shadow:0 10px 28px -12px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.04) inset;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--choc);color:var(--ink);font-family:"Plex",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html{overflow-x:clip;background-color:var(--choc);background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22220%22 height=%22220%22 viewBox=%220 0 220 220%22%3E%3Cg opacity=%22.32%22%3E%3Cg transform=%22translate(50 46) rotate(-18) scale(0.9) translate(-30 -22)%22%3E%3Cpath d=%22M4 22C10 12 20 8 30 14C40 8 50 12 56 22C46 20 38 21 30 21C22 21 14 20 4 22Z%22 fill=%22%23F4A7C0%22/%3E%3Cpath d=%22M4 23C14 23 22 23 30 23C38 23 46 23 56 23C50 36 38 40 30 40C22 40 10 36 4 23Z%22 fill=%22%23F4A7C0%22/%3E%3Cpath d=%22M6 22.2Q30 25.5 54 22.2%22 fill=%22none%22 stroke=%22%23C2557A%22 stroke-width=%222.2%22 stroke-linecap=%22round%22/%3E%3C/g%3E%3C/g%3E%3Cg opacity=%22.28%22%3E%3Cg transform=%22translate(160 72) rotate(24) scale(0.75) translate(-30 -22)%22%3E%3Cpath d=%22M4 22C10 12 20 8 30 14C40 8 50 12 56 22C46 20 38 21 30 21C22 21 14 20 4 22Z%22 fill=%22%23F4A7C0%22/%3E%3Cpath d=%22M4 23C14 23 22 23 30 23C38 23 46 23 56 23C50 36 38 40 30 40C22 40 10 36 4 23Z%22 fill=%22%23F4A7C0%22/%3E%3Cpath d=%22M6 22.2Q30 25.5 54 22.2%22 fill=%22none%22 stroke=%22%23C2557A%22 stroke-width=%222.2%22 stroke-linecap=%22round%22/%3E%3C/g%3E%3C/g%3E%3Cg opacity=%22.31%22%3E%3Cg transform=%22translate(98 152) rotate(9) scale(0.85) translate(-30 -22)%22%3E%3Cpath d=%22M4 22C10 12 20 8 30 14C40 8 50 12 56 22C46 20 38 21 30 21C22 21 14 20 4 22Z%22 fill=%22%23F4A7C0%22/%3E%3Cpath d=%22M4 23C14 23 22 23 30 23C38 23 46 23 56 23C50 36 38 40 30 40C22 40 10 36 4 23Z%22 fill=%22%23F4A7C0%22/%3E%3Cpath d=%22M6 22.2Q30 25.5 54 22.2%22 fill=%22none%22 stroke=%22%23C2557A%22 stroke-width=%222.2%22 stroke-linecap=%22round%22/%3E%3C/g%3E%3C/g%3E%3Cg opacity=%22.27%22%3E%3Cg transform=%22translate(188 188) rotate(-32) scale(0.7) translate(-30 -22)%22%3E%3Cpath d=%22M4 22C10 12 20 8 30 14C40 8 50 12 56 22C46 20 38 21 30 21C22 21 14 20 4 22Z%22 fill=%22%23F4A7C0%22/%3E%3Cpath d=%22M4 23C14 23 22 23 30 23C38 23 46 23 56 23C50 36 38 40 30 40C22 40 10 36 4 23Z%22 fill=%22%23F4A7C0%22/%3E%3Cpath d=%22M6 22.2Q30 25.5 54 22.2%22 fill=%22none%22 stroke=%22%23C2557A%22 stroke-width=%222.2%22 stroke-linecap=%22round%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");background-size:220px 220px;background-attachment:fixed}
@media (prefers-contrast:more),(prefers-reduced-transparency:reduce){html{background-image:none}}
::selection{background:var(--pink);color:var(--on-pink)}
body{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 18px) 18px 120px;max-width:440px;margin:0 auto}
body.bare{padding-bottom:40px}
h1,h2,h3,.num{font-family:"Baloo","Plex",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px;border-radius:12px}
#view:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* الترويسة */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.hello h1{font-size:28px;line-height:1.1;font-weight:800;text-wrap:balance}
.hello p{color:var(--ink-2);font-size:14px;margin-top:4px}
.top-end{display:flex;align-items:center;gap:6px;flex:none}
.cat{width:64px;height:64px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--choc-deep);background:var(--cream);border:1.5px solid var(--line)}
.icon-btn svg{width:22px;height:22px}
.page-top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.page-top h1{font-size:28px;font-weight:800;flex:1}

/* رسالة صالح — ظرف بفيونكة */
.letter{position:relative;background:var(--card-glass);border:1.5px solid #4A3D33;border-radius:var(--r-lg);padding:22px 20px 18px;box-shadow:var(--shadow);margin-bottom:22px}
.letter .bow{position:absolute;top:-16px;inset-inline-start:22px;width:46px;height:30px}
.letter .from{font-size:13px;color:var(--rose);font-weight:600;margin-bottom:6px}
.letter p{font-size:17px;line-height:1.7;color:var(--ink);white-space:pre-line}
.letter .sig{margin-top:10px;font-family:"Baloo";font-weight:700;color:var(--choc-deep);font-size:16px}
.letter.empty{border-style:dashed;border-color:var(--line);box-shadow:none}
.letter.empty p{font-size:15px;color:var(--ink-2)}

/* سوارة الالتزام */
.bracelet{background:var(--pink-soft);border-radius:var(--r-lg);padding:18px 18px 16px;margin-bottom:22px}
.bracelet-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.bracelet-head h2{font-size:18px;font-weight:700}
.bracelet-head .num{font-size:34px;font-weight:800;color:var(--rose);font-variant-numeric:tabular-nums}
.beads{--b:19px;display:flex;flex-wrap:nowrap;justify-content:space-between;gap:3px;align-items:center;position:relative;padding:6px 2px}
.beads::before{content:"";position:absolute;inset-inline:0;top:50%;height:2px;background:var(--choc-deep);opacity:.55;border-radius:2px}
.bead{position:relative;width:var(--b);height:var(--b);flex:none;border-radius:50%;background:var(--choc);border:2px solid #5A3B48;transition:background .3s var(--ease),border-color .3s}
.bead.on{background:radial-gradient(circle at 35% 30%,#FFE3EC 0 18%,var(--pink) 45%,#E98BAA 100%);border-color:#E98BAA}
.bead.charm{width:26px;height:26px;border:0;background:none}
.see-line{font-size:13px;line-height:1.7;color:var(--ink-2);margin:10px 2px 14px}
.bracelet .see-line{margin:10px 0 0;padding-top:10px;border-top:1px solid #5A3B48}
.see-line .link{min-height:32px;margin-inline-start:4px}
.bracelet .hint{font-size:13px;color:var(--ink-2);margin-top:10px}

/* أقسام */
h2.sec{font-size:19px;font-weight:700;margin:4px 4px 10px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--choc-deep);flex:none}
h2.sec .badge{margin-inline-start:auto}
.group{background:var(--card-glass);border:1.5px solid var(--line);border-radius:var(--r-md);margin-bottom:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px;width:100%;text-align:start}
.row+.row,.sub+.row{border-top:1px solid var(--line)}
.row .ic{width:26px;height:26px;flex:none;color:var(--choc-deep)}
.row .t{flex:1;font-size:16px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--ink-2);font-weight:400}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid #5C4A50;display:grid;place-items:center;flex:none;transition:background .25s var(--ease),border-color .25s}
.tick svg{width:16px;height:16px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s var(--ease)}
.row.done .tick,.row[aria-pressed="true"] .tick{background:var(--pink);border-color:var(--pink)}
.row.done .tick svg,.row[aria-pressed="true"] .tick svg{opacity:1;transform:none}
.row[aria-pressed="true"] .t{color:var(--ink-2)}
button.row:active{background:var(--card-2)}

/* الصلوات */
.prayers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 14px 16px}
.pr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 4px;min-height:64px;border-radius:var(--r-sm);background:var(--card-2);font-size:13px;transition:background .25s var(--ease)}
.pr b{font-weight:600;font-size:14px}
.pr span{color:var(--choc-deep);font-variant-numeric:tabular-nums}
.pr[aria-pressed="true"]{background:var(--pink)}
.pr[aria-pressed="true"],.pr[aria-pressed="true"] b{color:var(--on-pink)}
.pr[aria-pressed="true"] span{color:#3A2630}
.pr.next:not([aria-pressed="true"]){outline:2px solid var(--rose);outline-offset:-2px;background:var(--cream)}
.pr-note{font-size:12px;color:var(--ink-2);padding:0 16px 12px}

/* الماء */
.cups{display:grid;padding:0 6px 10px}
.cup-b{width:100%;min-width:44px;height:48px;display:grid;place-items:center;border-radius:12px}
.cup{width:26px;height:32px}
.cup path{fill:var(--card-2);stroke:#5C4A50;stroke-width:2}
.cup path.w{fill:transparent;stroke:none}
.cup-b[aria-pressed="true"] path.w{fill:#8FC6E3}
.cup-b[aria-pressed="true"] path.o{stroke:#8FC6E3}

/* حبوب الفيتامين */
.sub{padding:4px 16px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;background:var(--card-2);border:1.5px solid #4A3D42;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:var(--on-pink);font-weight:600}
.chip .x{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.25)}

/* بطاقات وأزرار عامة */
.card{background:var(--card-glass);border:1.5px solid var(--line);border-radius:var(--r-md);padding:18px;margin-bottom:16px}
.card h3{font-size:18px;font-weight:700;margin-bottom:6px}
.muted{color:var(--ink-2);font-size:14px;line-height:1.7}
.btn{min-height:48px;padding:12px 22px;border-radius:999px;background:var(--pink);color:var(--on-pink);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid #4A3D42}
.btn.small{min-height:44px;padding:8px 16px;font-size:14px}
.link{color:var(--rose);text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;font-family:"Plex"}
.badge.private{background:var(--card-2);color:var(--choc-deep);border:1px solid #4A3D33}
.badge.shared{background:var(--pink-soft);color:var(--rose);border:1px solid #5A3B48}
label.f{display:block;font-size:14px;color:var(--ink-2);margin:14px 2px 6px}
.in,textarea.in,select.in{width:100%;min-height:48px;padding:12px 14px;border-radius:var(--r-sm);background:var(--card-2);border:1.5px solid #4A3D42;font-size:16px;color:var(--ink)}
textarea.in{min-height:110px;resize:vertical;line-height:1.7}
.in::placeholder{color:#9C8A90}
.in:focus{border-color:var(--rose);outline:none}
.in:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.form-row{display:flex;gap:10px}
.form-row>*{flex:1;min-width:0}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:48px;height:48px;border-radius:50%;background:var(--card-2);border:1.5px solid #4A3D42;font-size:24px;line-height:1}
.stepper .num{font-size:30px;font-weight:800;min-width:2ch;text-align:center;color:var(--rose)}

/* القوائم: مهام ونوت ورسائل */
.item{background:var(--card-glass);border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px}
.item .body{font-size:16px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.item .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.item .tools{display:flex;gap:4px}
.item .tools button{min-width:44px;min-height:44px;padding:0 10px;border-radius:12px;color:var(--ink-2);font-size:13px}
.item .tools button:hover{background:var(--card-2)}
.receipt{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.receipt.read{color:var(--rose)}
.days-s{font-size:13px;color:var(--choc-deep);margin-top:2px}
.empty{text-align:center;padding:26px 18px;border:1.5px dashed var(--line);border-radius:var(--r-md);color:var(--ink-2);font-size:15px;line-height:1.8;margin-bottom:16px}
.empty svg{width:64px;height:64px;display:block;margin:0 auto 8px}
.zone{border-radius:var(--r-lg);padding:16px 14px 6px;margin-bottom:22px}
.zone.private{background:#1A1517;border:1.5px solid var(--line)}
.zone.shared{background:linear-gradient(180deg,#2A1C23,#1F191C 70%);border:1.5px solid #5A3B48}
.zone>header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 4px 6px;flex-wrap:wrap}
.zone>header h2{font-size:20px;font-weight:800}
.zone>.who{font-size:13px;color:var(--ink-2);margin:0 4px 12px;line-height:1.6}

/* إنجازاتي */
.streaks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.streak{background:var(--card-glass);border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px}
.streak .num{font-size:30px;font-weight:800;color:var(--rose);line-height:1.1}
.streak .l{font-size:13px;color:var(--ink-2);margin-top:2px}
.win{display:flex;gap:12px;align-items:flex-start;background:var(--card-glass);border:1.5px solid var(--line);border-radius:var(--r-md);padding:16px;margin-bottom:12px}
.win .medal{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--card-2);color:var(--choc-deep)}
.win .medal .ic{width:24px;height:24px}
.win.open{border-color:#5A3B48;background:linear-gradient(180deg,#2A1C23,var(--cream))}
.win.open .medal{background:var(--pink);color:var(--on-pink)}
.win h3{font-size:17px;font-weight:700}
.win .msg{margin-top:8px;padding:12px 14px;border-radius:var(--r-sm);background:var(--choc);border:1px solid #4A3D33;font-size:15px;line-height:1.75;white-space:pre-line}
.win .msg .sig{display:block;margin-top:6px;font-family:"Baloo";font-weight:700;color:var(--choc-deep)}
.bar{height:8px;border-radius:8px;background:var(--card-2);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);border-radius:8px}
.cat-hero{display:flex;align-items:center;gap:14px;background:var(--pink-soft);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:22px}
.cat-hero .cat{width:72px;height:72px}
.cat-hero.dance .cat{animation:hop 1.1s var(--ease) infinite}

/* قهوتي */
.brew{background:linear-gradient(180deg,#2A1C23,var(--cream) 70%);border:1.5px solid #5A3B48;border-radius:var(--r-lg);padding:18px;margin-bottom:16px}
.brew-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.brew-head h2{font-size:25px;font-weight:800;line-height:1.2}
.brew-head .kind{font-size:13px;color:var(--choc-deep);font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.brew-head .kind .ic{width:18px;height:18px}
.brew .note{color:var(--ink-2);font-size:14px;line-height:1.7;margin-top:6px}
.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 4px}
.spec{background:var(--card-2);border-radius:var(--r-sm);padding:10px 4px 8px;text-align:center;min-width:0}
.spec b{display:block;font-family:"Baloo";font-size:21px;font-weight:800;color:var(--rose);line-height:1.2;font-variant-numeric:tabular-nums}
.spec span{display:block;font-size:12px;color:var(--ink-2)}
.timer{text-align:center}
.btn .ic{width:22px;height:22px;flex:none}
.clock{font-family:"Baloo";font-size:68px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:1px;direction:ltr}
.clock-sub{font-size:13px;color:var(--ink-2);margin-top:4px}
.pour{margin:14px 0 4px;padding:12px 14px;border-radius:var(--r-sm);background:var(--pink-soft);border:1.5px solid #5A3B48}
.pour b{display:block;font-family:"Baloo";font-size:22px;font-weight:800;color:var(--rose)}
.pour span{display:block;font-size:14px;color:var(--ink);margin-top:2px;line-height:1.6}
.timer .actions{justify-content:center}
.steps{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:14px;text-align:start}
.step{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-radius:var(--r-sm);background:var(--card-2);border:1.5px solid transparent;font-size:14px;line-height:1.6;transition:background .25s var(--ease),border-color .25s}
.step .at{font-variant-numeric:tabular-nums;color:var(--choc-deep);font-weight:600;flex:none;min-width:3em;direction:ltr;text-align:end}
.step b{font-weight:600}
.step.now{border-color:var(--pink);background:var(--pink-soft)}
.step.past{opacity:.55}
.advice{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r-md);background:var(--card-2);border:1.5px solid #4A3D42;margin-bottom:16px;font-size:16px;line-height:1.7}
.advice .ic{width:28px;height:28px;flex:none;color:var(--rose)}
.advice small{display:block;font-size:13px;color:var(--ink-2)}
.mmss{display:flex;gap:10px;align-items:flex-end;direction:ltr}
.mmss>div{flex:1}
.mmss .colon{font-family:"Baloo";font-size:28px;font-weight:800;padding-bottom:6px}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumb{min-height:56px;border-radius:var(--r-sm);background:var(--card-2);border:1.5px solid #4A3D42;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px}
.thumb .ic{width:22px;height:22px}
.thumb[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:var(--on-pink)}
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bean{display:flex;flex-direction:column;gap:4px;text-align:center;min-width:0;border-radius:16px;padding:0}
.bean .ph{display:block;width:100%;aspect-ratio:3/4;border-radius:16px;background:var(--card-2);object-fit:cover;border:1.5px solid var(--line)}
.bean .n{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bean .r{font-size:12px;color:var(--ink-2);margin-top:-2px}
.shelf.mini{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.shelf.mini .ph{border-radius:12px}
button.bean[aria-pressed="true"] .ph{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink)}
.preview{display:block;width:100%;max-height:300px;object-fit:contain;border-radius:var(--r-md);background:var(--card-2);margin-bottom:6px}
.taste{display:flex;flex-direction:column;gap:12px}
.taste .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;min-height:32px;padding:4px 14px;border-radius:999px;background:var(--pink-soft);color:var(--rose);border:1px solid #5A3B48;font-weight:600;font-size:14px}
.tag.no{background:var(--card-2);color:var(--ink-2);border-color:#4A3D42}
.card h3{display:flex;align-items:center;gap:8px}
.card h3 .ic{width:22px;height:22px;flex:none;color:var(--choc-deep)}

/* الدخول والإعداد */
.login{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;justify-content:center}
.login .cat{width:96px;height:96px;margin:0 auto 10px;display:block}
.login h1{font-size:32px;font-weight:800;text-align:center}
.login .lead{text-align:center;color:var(--ink-2);margin:6px 0 18px}
.alert{border-radius:var(--r-sm);padding:12px 14px;font-size:14px;line-height:1.6;margin-top:12px;background:#3A1F28;border:1px solid #6B3446;color:#FFD9E5}
.alert.soft{background:var(--card-2);border-color:#4A3D42;color:var(--ink)}

/* حالة: بدون نت، لحظة، رسالة */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 12px;border-radius:999px;background:var(--card-2);color:var(--ink-2);border:1px solid #4A3D42;margin-bottom:14px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--choc-deep)}
.loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:60px 0;color:var(--ink-2)}
.loading .cat{animation:breathe 1.6s ease-in-out infinite}
.toast{position:fixed;inset-inline:18px;bottom:calc(env(safe-area-inset-bottom) + 92px);max-width:404px;margin:0 auto;background:var(--ink);color:var(--choc);padding:12px 16px;border-radius:16px;font-size:15px;font-weight:500;box-shadow:var(--shadow);z-index:30;animation:rise .3s var(--ease)}
.heart{position:fixed;pointer-events:none;z-index:40;width:18px;height:18px;animation:float 900ms var(--ease) forwards}

/* الاحتفال */
.party{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(20,16,18,.86);backdrop-filter:blur(6px);padding:24px}
.party .box{text-align:center;max-width:340px}
.party .cat{width:140px;height:140px;display:block;margin:0 auto 10px;animation:hop 1s var(--ease) infinite}
.party h2{font-size:28px;font-weight:800;margin-bottom:6px}
.party p{color:var(--ink-2);margin-bottom:18px;line-height:1.7}
.party .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.party .confetti svg{position:absolute;top:-30px;width:20px;height:20px;animation:fall 2.6s linear infinite}

/* مباركة الملكة */
.toast.queen{inset-inline:0;width:max-content;max-width:calc(100% - 36px);display:flex;align-items:center;gap:8px;background:var(--pink);color:var(--on-pink);border-radius:999px;padding:10px 18px;font-weight:600;animation:rise .3s var(--ease)}
.toast.queen svg{width:20px;height:20px;flex:none}
.party.queen h2{font-family:"Baloo","Plex",sans-serif;font-size:34px;line-height:1.3;color:var(--rose)}
.party.queen .cat{position:relative}
.party.queen .crowned{position:relative;width:150px;margin:0 auto 6px}
.party.queen .crowned{animation:hop 1.2s var(--ease) 2}
.party.queen .crowned .cat{width:150px;height:150px;margin:0;animation:none}
.party.queen .crown{position:absolute;top:-14px;inset-inline-start:50%;width:56px;height:40px;margin-inline-start:-28px;z-index:1}
.party.queen .burst{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.party.queen .burst svg{position:absolute;top:46%;inset-inline-start:50%;width:22px;height:22px;opacity:0;animation:kissburst 1.4s var(--ease) forwards;animation-delay:var(--d)}
@keyframes kissburst{0%{opacity:0;transform:translate(0,0) scale(.4) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.1) rotate(var(--r))}}

@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
@keyframes breathe{50%{transform:scale(1.06)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes float{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-60px) scale(1.2)}}
@keyframes fall{to{transform:translateY(110vh) rotate(260deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* شريط التنقل */
nav.tabs{position:fixed;inset-inline:0;bottom:0;padding:10px 8px calc(env(safe-area-inset-bottom) + 10px);background:rgba(20,16,18,.94);backdrop-filter:saturate(1.2) blur(8px);border-top:1.5px solid var(--line);z-index:20}
nav.tabs ul{display:flex;justify-content:space-around;list-style:none;max-width:440px;margin:0 auto}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--ink-2);text-decoration:none;padding:4px 10px;min-width:56px;min-height:48px;border-radius:14px}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current]{color:var(--rose);background:var(--pink-soft);font-weight:600}
.foot{font-size:12px;color:var(--ink-2);text-align:center;margin-top:8px}

/* التنبيهات */
.push-card{background:linear-gradient(180deg,#2A1C23,var(--cream) 75%);border:1.5px solid #5A3B48;border-radius:var(--r-md);padding:18px;margin-bottom:16px}
.push-card h3{font-size:18px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.push-card h3 .ic{width:22px;height:22px;flex:none;color:var(--rose)}
.push-card ol{margin:10px 0 0;padding-inline-start:22px;line-height:1.9;font-size:15px}
.push-card ol b{color:var(--rose);font-weight:600}
.push-on{display:inline-flex;align-items:center;gap:6px;color:var(--rose);font-weight:600;font-size:15px}
.rem{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 0}
.rem+.rem{border-top:1px solid var(--line)}
.rem label{flex:1;display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px;cursor:pointer}
.rem input[type=checkbox]{width:22px;height:22px;accent-color:var(--pink);flex:none}
.rem .in{width:auto;flex:none;min-height:44px;padding:8px 10px;font-size:15px}
.rem .in:disabled{opacity:.45}
.rem small{display:block;font-size:12px;color:var(--ink-2)}

/* ============================================================ الجلسة (Supabase Auth عبر fetch، نفس نمط lab/index.html) */
function NetError(msg) { this.name = 'NetError'; this.message = msg || 'offline'; }
function HttpError(status, body) { this.name = 'HttpError'; this.status = status; this.message = body; }
function AuthError(msg) { this.name = 'AuthError'; this.message = msg; }
/* ما فيه اتصال أصلًا (مو خطأ من الخادم) */
function isOffline(e) { return e instanceof NetError && (e.message === 'offline' || e.message === 'refresh_unreachable'); }

var Auth = {
  sess: null,
  load: function () { this.sess = LS.get('session', null); return !!(this.sess && this.sess.access_token); },
  save: function (s) {
    if (!s.expires_at) s.expires_at = Math.floor(Date.now() / 1000) + (s.expires_in || 3600);
    this.sess = s; LS.set('session', s);
  },
  uid: function () { return this.sess && this.sess.user && this.sess.user.id; },
  mustChange: function () { var u = this.sess && this.sess.user; return !!(u && u.user_metadata && u.user_metadata.must_change_password === true); },
  /* تغيير كلمة المرور (أول دخول). كلمة المرور ما تنكتب بأي لوج ولا تنحفظ؛ نحدّث الجلسة بنسخة المستخدم الراجعة بس. */
  setPassword: async function (password) {
    var r;
    try {
      r = await fetch(SB_URL + '/auth/v1/user', {
        method: 'PUT', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + await this.token(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: password, data: { must_change_password: false } })
      });
    } catch (e) { if (e instanceof AuthError) throw e; throw new NetError(); }
    if (!r.ok) {
      var b = {}; try { b = await r.json(); } catch (e) { /* not json */ }
      var code = b.error_code || b.code || '';
      if (r.status === 401) throw new AuthError('expired');
      if (code === 'same_password') throw new AuthError('same_password');
      if (code === 'weak_password') throw new AuthError('weak_password');
      if (r.status === 429) throw new AuthError('rate_limited');
      if (r.status === 422) throw new AuthError('weak_password');
      throw new AuthError('pw_' + r.status);
    }
    var u = null; try { u = await r.json(); } catch (e) { /* keep local copy */ }
    var user = (u && u.id) ? u : Object.assign({}, this.sess.user, { user_metadata: Object.assign({}, this.sess.user.user_metadata, { must_change_password: false }) });
    if (user.user_metadata) user.user_metadata.must_change_password = false;
    this.save(Object.assign({}, this.sess, { user: user }));
  },
  signIn: async function (email, password) {
    var r;
    try {
      r = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
        method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      });
    } catch (e) { throw new NetError(); }
    if (!r.ok) {
      var b = {}; try { b = await r.json(); } catch (e) { /* not json */ }
      var code = b.error_code || b.error || '';
      if (code === 'email_not_confirmed') throw new AuthError('email_not_confirmed');
      if (r.status === 429) throw new AuthError('rate_limited');
      if (r.status === 400 || code === 'invalid_credentials' || code === 'invalid_grant') throw new AuthError('bad_credentials');
      throw new AuthError('auth_' + r.status);
    }
    this.save(await r.json());
  },
  /* تحديث الجلسة. فشل نهائي بس (الرمز نفسه مرفوض) يطلعها؛ أي شي ثاني (نت، 5xx، 429، مهلة) = مؤقت ونجرب بعدين.
     طلب واحد بنفس الوقت عشان ما ينصرف نفس refresh_token مرتين. */
  _refreshing: null,
  refresh: function () {
    var self = this;
    if (!self._refreshing) {
      self._refreshing = self._doRefresh().then(function (v) { self._refreshing = null; return v; }, function (e) { self._refreshing = null; throw e; });
    }
    return self._refreshing;
  },
  _doRefresh: async function () {
    var r, ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctl && setTimeout(function () { ctl.abort(); }, 15000);
    try {
      r = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: this.sess.refresh_token }), signal: ctl ? ctl.signal : undefined
      });
    } catch (e) { throw new NetError('refresh_unreachable'); }
    finally { if (timer) clearTimeout(timer); }
    if (r.ok) return this.save(await r.json());
    var text = ''; try { text = await r.text(); } catch (e) { /* ignore */ }
    if ((r.status === 400 || r.status === 401) && /invalid_grant|refresh_token_not_found|refresh_token_already_used|session_not_found|session_expired/.test(text)) {
      throw new AuthError('expired');
    }
    throw new NetError('refresh_' + r.status);              // مؤقت: نبقى على الجلسة والكاش
  },
  token: async function () {
    if (this.sess.expires_at && this.sess.expires_at - 60 < Date.now() / 1000) await this.refresh();
    return this.sess.access_token;
  },
  signOut: async function () {
    var s = this.sess; this.sess = null;
    stopBackground();                        // مؤقتات إعادة المحاولة + طابور الذاكرة + مؤقت القهوة: ما تكمل بعد الخروج
    LS.del('session'); LS.del('cache'); LS.del('coffee');      // الطابور ما ينحذف أبد: محفوظ باسم المستخدم ويترفع لما ترجع تدخل
    if (s && s.access_token && !DEMO) {
      try { await fetch(SB_URL + '/auth/v1/logout', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + s.access_token } }); } catch (e) { /* offline: the token just expires */ }
    }
  }
};

async function api(path, opt, retried) {
  opt = opt || {};
  var h = { apikey: SB_KEY, Authorization: 'Bearer ' + await Auth.token(), 'Content-Type': opt.type || 'application/json' };
  if (opt.prefer) h.Prefer = opt.prefer;
  if (opt.upsert === false) h['x-upsert'] = 'false';
  var body = opt.raw !== undefined ? opt.raw : opt.body !== undefined ? JSON.stringify(opt.body) : undefined;   // raw = ملف (صورة الكيس)
  var r;
  try {
    r = await fetch(SB_URL + path, { method: opt.method || 'GET', headers: h, body: body });
  } catch (e) { throw new NetError(); }
  if (r.status === 401 && !retried) { await Auth.refresh(); return api(path, opt, true); }
  if (r.status >= 500 || r.status === 429 || r.status === 408) throw new NetError('http_' + r.status);
  if (!r.ok) throw new HttpError(r.status, await r.text());
  var t = await r.text(); return t ? JSON.parse(t) : null;
}
function q(v) { return encodeURIComponent(v); }

/* "upsert" بدون DO UPDATE على أعمدة المفتاح:
   صلاحيات الأعمدة في schema.sql تسمح بتحديث (value/pct, updated_at) بس، و upsert الافتراضي في PostgREST
   (resolution=merge-duplicates) يكتب SET لكل الأعمدة بما فيها user_id → يرفضه Postgres.
   فنسوي: insert ... on_conflict DO NOTHING ثم PATCH للقيمة. الاثنين idempotent — تكرار الرفع ما يكرر صفوف. */
async function upsertRow(table, row, conflictCols, patch, filter) {
  await api('/rest/v1/' + table + '?on_conflict=' + conflictCols, { method: 'POST', body: row, prefer: 'resolution=ignore-duplicates,return=minimal' });
  await api('/rest/v1/' + table + '?' + filter, { method: 'PATCH', body: patch, prefer: 'return=minimal' });
}

      var d = addDays(today, -i), wd = Jojo.weekday(d), full = i === 3;

      MEALS.forEach(function (m, j) { if (full || (i + j) % 3 !== 0) put(d, 'meal:' + m[0], true); });
      if (full || i % 2 === 1) put(d, 'vitamins', true);
      put(d, 'water', full ? 8 : 3 + (i % 6));
      if (settings.gymDays.indexOf(wd) !== -1 && (full || i < 12)) put(d, 'gym', true);
      tasks.forEach(function (t) { if (full || i % 2 === 0) put(d, 'task:' + t.id, true); });
    }
    ['prayer:fajr', 'prayer:dhuhr', 'sleep', 'wake', 'meal:breakfast', 'vit:فيتامين د', 'vit:ب١٢', 'task:t2'].forEach(function (k) { put(today, k, true); });

/* ============================================================ طابور التأشير بدون نت
   queue = { 'c|<date>|<key>': {t:'c', date, key, value, seq}, 'd|<date>': {t:'d', date, pct, seq} }
   مفتاح لكل بند → آخر قيمة بس، فإعادة الرفع ما تكرر شي. */
var flushing = false, retryTimer = null, seq = 0, backoff = 0, retryToasted = false;
function dequeue(id, s) {
  var cur = queue();
  if (cur[id] && cur[id].seq === s) { delete cur[id]; LS.set(qkey(), cur); }
  if (memQueue[id] && memQueue[id].seq === s) delete memQueue[id];
}
function qkey() { return 'queue.' + (Auth.uid() || 'anon'); }
function queue() { return LS.get(qkey(), {}); }
function enqueue(entry) {
  var qd = queue(), id = entry.t === 'c' ? 'c|' + entry.date + '|' + entry.key : 'd|' + entry.date;
  entry.seq = Date.now() + '-' + (seq++);
  qd[id] = entry;
  if (!LS.set(qkey(), qd)) memQueue[id] = entry;   // لو localStorage مقفل، نخليه بالذاكرة
}
var memQueue = {};
function allQueued() { return Object.assign({}, queue(), memQueue); }
function applyQueue() {
  var qd = allQueued();
  Object.keys(qd).forEach(function (id) { var e = qd[id]; if (e.t === 'c' && e.date === S.today) S.checks[e.key] = e.value; });
}
function pendingCount() { return Object.keys(allQueued()).filter(function (k) { return k.charAt(0) === 'c'; }).length; }

async function flush() {
  if (flushing || !store || !Auth.sess) return;
  flushing = true;
  var failed = false, hadNet = true, poison = 0;
  try {
    var qd = allQueued();
    var ids = Object.keys(qd).sort(function (a, b) { return a.charAt(0) === b.charAt(0) ? 0 : a.charAt(0) === 'c' ? -1 : 1; }); // البنود قبل النسبة
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i], e = qd[id];
      try {
        if (e.t === 'c') await store.setCheck(e.date, e.key, e.value);
        else await store.setDaily(e.date, e.pct);
        var cur = queue();
        dequeue(id, e.seq);
      } catch (err) {
        if (err instanceof AuthError) { flushing = false; return sessionExpired(); }
        if (err instanceof HttpError && err.status !== 401) {
          // رفض نهائي من الخادم (4xx): نشيل هالبند بس ونكمل الباقي بدل ما يوقف الطابور كله
          if (window.console) console.warn('jojo: dropped queue entry', id, err.status, err.message);
          dequeue(id, e.seq); poison++;
          continue;
        }
        failed = true; hadNet = !isOffline(err);
        break;
      }
    }
  } finally { flushing = false; }
  if (!failed) { backoff = 0; retryToasted = false; }
  setOnline(!(failed && !hadNet));
  if (poison) toast('ما قدرت أحفظ ' + (poison === 1 ? 'تأشيرة' : 'كم تأشيرة') + '، أشريها مرة ثانية');
  if (failed) {
    if (hadNet && !retryToasted) { retryToasted = true; toast('ما قدرت أحفظ، بجرب مرة ثانية'); }   // مرة وحدة، مو مع كل محاولة صامتة
    backoff = Math.min(backoff ? backoff * 2 : 5000, 300000);   // ٥ ثواني ← ٥ دقايق
    clearTimeout(retryTimer); retryTimer = setTimeout(flush, backoff);
  } else if (Object.keys(allQueued()).length) {
    setTimeout(flush, 0);                      // تأشيرات صارت أثناء الرفع → نكمل
  }
  if (route === 'today') updatePending();
}
function setOnline(v) {
  if (S.online === v) return;
  S.online = v;
  if (route === 'today') updatePending();
}
function updatePending() {
  var el = $('#pending'); if (!el) return;
  var n = pendingCount();
  if (!S.online) { el.hidden = false; el.innerHTML = '<i></i> بدون نت — تأشيراتك محفوظة عندك وبترتفع أول ما يرجع'; }
  else if (n) { el.hidden = false; el.innerHTML = '<i></i> أرفع ' + ar(n) + ' من تأشيراتك…'; }
  else el.hidden = true;
}

/* تأشير بند: تحديث فوري + طابور + رفع */
var touchGen = 0, touchedAt = {};   // متى آخر مرة تأشر كل بند (للدمج مع لقطة الخادم)
function setCheck(key, value, extra) {
  var before = score(), doneBefore = doneCount();
  S.checks[key] = value; touchedAt[key] = ++touchGen;
  (extra || []).forEach(function (x) { touchedAt[x[0]] = ++touchGen; });
  enqueue({ t: 'c', date: S.today, key: key, value: value });
  (extra || []).forEach(function (x) { S.checks[x[0]] = x[1]; enqueue({ t: 'c', date: S.today, key: x[0], value: x[1] }); });
  queueDaily();
  saveCache();
  var after = score();
  if (route === 'today') renderToday();
  var celebrating = after === 100 && before !== 100 && celebrateDay();
  if (!celebrating && doneCount() > doneBefore) queenToast();
  flush();
}

  if ((S.checks.vitamins === true) !== all && v.length) {
    S.checks.vitamins = all; touchedAt.vitamins = ++touchGen;
    enqueue({ t: 'c', date: S.today, key: 'vitamins', value: all });

}

/* ============================================================ قهوتي
   وصفة اليوم (مكتبة jojo_recipes) + مؤقت صب + نصيحة الطحنة على Encore + رف الأكياس (صور بس) + التقييم + ذوقي.
   بدون أي ذكاء اصطناعي أو مفاتيح. بند coffee بونص: مو من بنود السوارة، فالنسبة ما تتغير. */
var TASTES = ['حلو', 'حامض', 'مر', 'خفيف', 'ثقيل'];
var ROAST_AR = { light: 'فاتح', medium: 'وسط', dark: 'غامق' };
var C = { recipes: null, beans: null, ratings: null, err: false, loading: false, urls: {}, urlsExp: 0, pick: 0, photo: null };
var B = { phase: 'idle', t0: 0, acc: 0, timer: null, sec: null, grind: null, advice: null, recipeId: null, lock: null, step: -2 };
var RD = { liked: null, notes: [], bean: null };     // مسودة التقييم

function mmss(sec) { return ar(mmssL(sec)); }
/* الساعة الكبيرة بأرقام لاتينية: «٠:٠٠» بخط كبير يطلع نقاط ونقطتين وتنلخبط */
function mmssL(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function clampGrind(g) { return Math.max(1, Math.min(40, Math.round(g))); }
function coffeeCache() { if (!DEMO) LS.set('coffee', { uid: Auth.uid(), recipes: C.recipes, beans: C.beans, ratings: C.ratings }); }
function resetCoffee() { brewStop(); if (C.photo) URL.revokeObjectURL(C.photo.url); C = { recipes: null, beans: null, ratings: null, err: false, loading: false, urls: {}, urlsExp: 0, pick: 0, photo: null }; }

async function loadCoffee() {
  if (C.loading) return;
  C.loading = true; C.err = false;
  try {
    var r = await Promise.all([store.recipes(), store.beans(), store.ratings()]);
    C.recipes = r[0] || []; C.beans = r[1] || []; C.ratings = r[2] || [];
    coffeeCache();
  } catch (e) {
    C.loading = false;
    if (e instanceof AuthError) return sessionExpired();
    var c = !DEMO && LS.get('coffee', null);      // بدون نت: آخر نسخة محفوظة
    if (c && c.uid === Auth.uid() && c.recipes) { C.recipes = c.recipes; C.beans = c.beans || []; C.ratings = c.ratings || []; }
    else C.err = true;
  }
  C.loading = false;
  if (route === 'coffee') renderCoffee();
}
function ratingsForCore() { return (C.ratings || []).map(function (r) { return { beanId: r.bean_id, liked: r.liked === true, notes: r.notes || [] }; }); }
/* وصفة اليوم من Jojo.recipeOfDay (مرجّحة بذوقها). "وصفة ثانية" تمشي على المكتبة. وقت الصب تثبت الوصفة. */
var rod = null;   // { key, id }: وصفة اليوم تنحسب مرة لكل تاريخ، وما تتغير بعد ما تحفظ تقييم
function recipeOfDayOnce(list) {
  var key = (Auth.uid() || '') + '|' + S.today, lsk = 'rod.' + key, id = null;
  if (rod && rod.key === key) id = rod.id;
  else { try { id = LS.get(lsk, null); } catch (e) { id = null; } }
  var hit = id != null && list.filter(function (x) { return x.id === id; })[0];
  if (hit) { rod = { key: key, id: id }; return hit; }
  var base = Jojo.recipeOfDay(list, ratingsForCore(), S.today);
  rod = { key: key, id: base.id };
  try { LS.set(lsk, base.id); } catch (e) { /* optional */ }
  return base;
}
function currentRecipe() {
  var list = C.recipes || [];
  if (!list.length) return null;
  if (B.recipeId) { var held = list.filter(function (x) { return x.id === B.recipeId; })[0]; if (held) return held; }
  var base = recipeOfDayOnce(list);
  return C.pick ? list[(list.indexOf(base) + C.pick) % list.length] : base;
}
function savedGrind(r) { var g = LS.get('grind.' + r.id, null); return typeof g === 'number' ? g : null; }

/* ---- المؤقت: يعتمد على الوقت الفعلي، فيكمل صح لو قفلت الشاشة أو راحت لتبويب ثاني ---- */
function brewElapsed() { return B.acc + (B.phase === 'run' ? (Date.now() - B.t0) / 1000 : 0); }
function wakeLock(on) {
  try {
    if (on && navigator.wakeLock && !B.lock) navigator.wakeLock.request('screen').then(function (l) { B.lock = l; try { l.addEventListener('release', function () { if (B.lock === l) B.lock = null; }); } catch (e) { /* optional */ } }).catch(function () { /* optional */ });
    else if (!on && B.lock) { B.lock.release().catch(function () { /* ignore */ }); B.lock = null; }
  } catch (e) { /* optional */ }
}
function brewStart(r) {
  if (B.phase === 'idle') { B.acc = 0; B.recipeId = r.id; B.step = -2; }
  B.phase = 'run'; B.t0 = Date.now();
  clearInterval(B.timer); B.timer = setInterval(brewTick, 250);
  wakeLock(true);
}
function brewPause() { B.acc = brewElapsed(); B.phase = 'pause'; clearInterval(B.timer); B.timer = null; wakeLock(false); }
function brewFinish(r) {
  B.acc = brewElapsed(); B.phase = 'ask'; clearInterval(B.timer); B.timer = null; wakeLock(false);
  var g = savedGrind(r); B.grind = g != null ? g : r.grind_encore;
}
function brewStop() {
  clearInterval(B.timer); wakeLock(false);
  B = { phase: 'idle', t0: 0, acc: 0, timer: null, sec: null, grind: null, advice: null, recipeId: null, lock: null, step: -2 };
  RD = { liked: null, notes: [], bean: null };
}
function stepIndex(r, el) {
  var i = -1;
  (r.steps || []).forEach(function (s, j) { if (s.at_sec <= el) i = j; });
  return i;
}
function pourText(r, el) {

  if (B.phase === 'idle') return { b: 'أول شي: صبي لين ' + ar(st[0].pour_to_g) + ' جم', s: st[0].note || '' };
  var i = stepIndex(r, el);
  var last = st[st.length - 1];
  if (i === st.length - 1 && el > last.at_sec + 25) return { b: 'خليها تنزل كلها', s: 'لما يوقف التقطير اضغطي «خلصت»' };
  var x = st[Math.max(0, i)];

}
function nextText(r, el) {

  var nx = $('#pourNext'); if (nx) nx.textContent = nextText(r, el);
  var st = r.steps || [];
  var key = i + (st.length && i === st.length - 1 && el > st[i].at_sec + 25 ? 'end' : '');
  if (key !== B.step) {
    var first = B.step === -2;
    B.step = key;
    var p = pourText(r, el), box = $('#pour');
    if (box) box.innerHTML = '<b>' + esc(p.b) + '</b>' + (p.s ? '<span>' + esc(p.s) + '</span>' : '');
    document.querySelectorAll('#steps .step').forEach(function (li, j) {
      li.classList.toggle('now', j === i && B.phase !== 'idle');
      li.classList.toggle('past', B.phase !== 'idle' && j < i);

  }
}

/* ---- الصورة: أي صورة يقدر المتصفح يفتحها (فيها HEIC بالآيفون) → JPEG ≤ ١٢٨٠px جودة ٠٫٨ ---- */
async function toJpeg(file) {
  var src = null, w, h;
  try {
    src = await createImageBitmap(file, { imageOrientation: 'from-image' });
    w = src.width; h = src.height;
  } catch (e) {
    src = await new Promise(function (res, rej) {
      var u = URL.createObjectURL(file), im = new Image();
      im.onload = function () { URL.revokeObjectURL(u); res(im); };
      im.onerror = function () { URL.revokeObjectURL(u); rej(new Error('decode')); };
      im.src = u;
    });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  if (!w || !h) throw new Error('decode');
  var k = Math.min(1, 1280 / Math.max(w, h)), cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
  var c = document.createElement('canvas'); c.width = cw; c.height = ch;
  var x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, cw, ch);           // صور PNG الشفافة ما تطلع سودا
  x.drawImage(src, 0, 0, cw, ch);
  if (src.close) src.close();
  return new Promise(function (res, rej) { c.toBlob(function (b) { if (b) res(b); else rej(new Error('encode')); }, 'image/jpeg', 0.8); });
}
async function ensureUrls() {
  var now = Date.now();
  if (now > C.urlsExp) { Object.keys(C.urls).forEach(function (k) { if (!/^blob:/.test(C.urls[k])) delete C.urls[k]; }); C.urlsExp = 0; }
  var need = (C.beans || []).map(function (b) { return b.photo_path; }).filter(function (p) { return p && !C.urls[p]; });
  if (need.length) {
    try {
      var m = await store.signUrls(need);
      Object.assign(C.urls, m);
      if (!C.urlsExp) C.urlsExp = now + 50 * 60e3;                // الروابط صالحة ساعة، نجددها قبلها
    } catch (e) { return; }
  }
  document.querySelectorAll('img[data-path]').forEach(function (img) {
    var u = C.urls[img.getAttribute('data-path')];
    if (u && img.getAttribute('src') !== u) img.src = u;
  });
}
function beanName(b) { return b.name || 'كيس بدون اسم'; }
function beanImg(b) {

  return '<img class="ph" data-path="' + esc(b.photo_path || '') + '"' + (u ? ' src="' + esc(u) + '"' : '') + ' alt="كيس ' + esc(beanName(b)) + '" loading="lazy">';
}

/* ---- الرسم ---- */
function recipeCard(r) {

    (r.note ? '<p class="note">' + esc(r.note) + '</p>' : '') +

function timerCard(r) {

      '<div class="mmss"><div><label class="f" for="bm">دقايق</label><input id="bm" class="in" type="number" inputmode="numeric" min="0" max="20" name="m" value="' + m + '" required></div>' +
      '<span class="colon" aria-hidden="true">:</span><div><label class="f" for="bsx">ثواني</label><input id="bsx" class="in" type="number" inputmode="numeric" min="0" max="59" name="s" value="' + s + '" required></div></div>' +
      '<label class="f">طحنتك اليوم على Encore</label><div class="stepper" role="group" aria-label="رقم الطحنة"><button type="button" data-act="grind" data-d="-1" aria-label="أنعم">−</button>' +
      '<span class="num" id="grindNum" aria-live="polite">' + ar(B.grind) + '</span><button type="button" data-act="grind" data-d="1" aria-label="أخشن">+</button><span class="muted">أصغر = أنعم</span></div>' +
      '<div class="actions"><button class="btn block">شوفي النتيجة</button></div></form>';
  }
  var iced = r.ice && ph === 'idle' ? '<p class="muted" style="margin-top:8px">حطي ' + ar(r.ice) + ' جم ثلج بالسيرفر، وصفّري الميزان مع الدريبر والقهوة قبل ما تبدين.</p>' : '';
  return '<section class="card timer" aria-label="مؤقت الصب">' +
    '<div class="clock" id="clock" role="timer" aria-label="الوقت">' + mmssL(el) + '</div><div class="clock-sub">الهدف ' + mmss(r.target_sec) + '</div>' +
    (ph === 'ask' || ph === 'done' ? '' : '<div class="pour" id="pour" aria-live="polite"><b>' + esc(p.b) + '</b>' + (p.s ? '<span>' + esc(p.s) + '</span>' : '') + '</div><p class="clock-sub" id="pourNext">' + nextText(r, el) + '</p>') +

/* ============================================================ إنجازاتي */
async function loadWins() {
  S.winsErr = false;
  try {
    var from = addDays(S.today, -59);
    var rows = await store.checks(from, S.today);
    var by = {};
    (rows || []).forEach(function (c) { (by[c.date] = by[c.date] || {})[c.key] = c.value; });
    by[S.today] = Object.assign({}, by[S.today] || {}, S.checks);            // اليوم: الحالة المحلية (فيها اللي بالطابور)
    var days = [];
    for (var d = from; d <= S.today; d = addDays(d, 1)) {
      days.push({ date: d, items: Jojo.requiredItems(S.settings, tasksOn(d), d), checks: by[d] || {}, waterGoal: S.settings.waterGoal });
    }
    var unlocked = Jojo.unlocked(days);
    // نحفظ اللي انفتح بالإعدادات عشان ما يتقفل بعد ما يطلع من نافذة الـ٦٠ يوم
    var kept = S.settings.wins || [];
    var all = kept.concat(unlocked.filter(function (k) { return kept.indexOf(k) === -1; }));
    if (all.length !== kept.length) { S.settings.wins = all; saveCache(); store.saveSettings(S.settings).catch(function () { /* next time */ }); }
    var msgs = await store.winMessages(all);
    S.wins = { days: days, unlocked: all, msgs: msgs || [] };
  } catch (e) {
    if (e instanceof AuthError) return sessionExpired();
    S.winsErr = true;
  }
  if (route === 'wins') renderWins();
}
function prayersStreak(days) {
  return Math.min.apply(null, PRAYERS.map(function (p) { return Jojo.streak(days, 'prayer:' + p[0]); }));
}
function renderWins() {
  var head = '<header class="page-top"><h1>إنجازاتي</h1></header>';
  if (S.winsErr) return paint(head + '<div class="empty">ما قدرت أجيب إنجازاتك، تأكدي من النت وجربي مرة ثانية.<div class="actions" style="justify-content:center"><button class="btn small" data-act="retry-wins">جربي مرة ثانية</button></div></div>');
  if (!S.wins) { loadWins(); return paint(head + '<div class="loading" role="status">' + catSVG() + 'لحظة أحسب إنجازاتك…</div>'); }
  var w = S.wins, days = w.days, un = w.unlocked;
  var fullDays = days.filter(function (d) { return Jojo.dayScore(d.items, d.checks, { waterGoal: d.waterGoal }) === 100; }).length;
  var st = [
    [prayersStreak(days), 'الصلوات كاملة'],
    [Jojo.streak(days, 'sleep'), 'نوم بوقتي'],
    [Jojo.streak(days, 'wake'), 'صحيان بوقتي'],
    [Jojo.streak(days, 'water'), 'وصلت هدف الماء']
  ];
  if ((S.settings.vitamins || []).length) st.push([Jojo.streak(days, 'vitamins'), 'الفيتامينات']);
  var gym = (S.settings.gymDays || []).length ? Jojo.streak(days, 'gym') : null;

  var cards = st.map(function (x) {
    return '<div class="streak"><div class="num">' + ar(x[0]) + '</div><div class="l">' + (x[0] === 0 ? 'ابدئي من اليوم' : (x[0] === 1 ? 'يوم' : x[0] === 2 ? 'يومين' : x[0] <= 10 ? 'أيام' : 'يوم') + ' ورا بعض') + ' · ' + x[1] + '</div></div>';
  }).join('') + (gym != null ? '<div class="streak"><div class="num">' + ar(gym) + '</div><div class="l">' + (gym === 1 ? 'حصة' : gym === 2 ? 'حصتين' : gym && gym <= 10 ? 'حصص' : 'حصة') + ' نادي ورا بعض</div></div>' : '');

  var msgOf = {};
  w.msgs.forEach(function (m) { if (!msgOf[m.achievement]) msgOf[m.achievement] = m; });
  var list = WINS.map(function (x) {
    var open = un.indexOf(x.key) !== -1, m = msgOf[x.key];
    var prog = '';
    if (!open && x.goal) {
      var n = Math.min(Jojo.streak(days, x.streakKey), x.goal);
      prog = '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + x.goal + '" aria-valuenow="' + n + '" aria-label="' + esc(x.title) + '"><i style="width:' + Math.round(n / x.goal * 100) + '%"></i></div><div class="s" style="font-size:12px;color:var(--ink-2);margin-top:4px">' + ar(n) + ' من ' + ar(x.goal) + '</div>';
    }
    var body = open
      ? (m ? '<div class="msg">' + esc(m.body) + '<span class="sig">— صالح</span></div>' : '<p class="muted">انفتح! 🎀</p>')
      : '<p class="muted">' + x.how + '</p>' + prog;
    return '<article class="win' + (open ? ' open' : '') + '"><div class="medal" aria-hidden="true">' + (open ? IC[x.icon] : IC.lock) + '</div><div style="flex:1;min-width:0"><h3>' + x.title + '</h3>' + body + '</div></article>';
  }).join('');

  var anyOpen = un.length > 0;
  paint(head +
    '<div class="cat-hero' + (anyOpen ? ' dance' : '') + '">' + catSVG() + '<div><h2 style="font-size:20px;font-weight:800">' + (fullDays ? countWord(fullDays, 'يوم كامل واحد', 'يومين كاملين', 'أيام كاملة', 'يوم كامل') : 'كل يوم فرصة جديدة') + '</h2>' +
    '<p class="muted">' + (fullDays ? 'سوارتك كملت فيها آخر ٦٠ يوم. كفو!' : 'إنجازاتك بتنفتح وحدة وحدة، وكل وحدة معها رسالة من صالح 🎀') + '</p></div></div>' +
    '<h2 class="sec">سلاسلي</h2><div class="streaks">' + cards + '</div>' +
    '<h2 class="sec">رسائل الإنجاز</h2>' + list
  );

  // تعليم رسائل الإنجاز المفتوحة كمقروءة + احتفال بأي إنجاز جديد
  WINS.forEach(function (x) { var m = msgOf[x.key]; if (m && !m.seen_at && un.indexOf(x.key) !== -1) { m.seen_at = new Date().toISOString(); store.markSeen(m.id).catch(function () { m.seen_at = null; }); } });
  var seen = LS.get('seenWins', []);
  var fresh = un.filter(function (k) { return seen.indexOf(k) === -1; });
  if (fresh.length) {
    LS.set('seenWins', seen.concat(fresh));
    if (!/quiet/.test(location.search)) {
      var x = WINS.filter(function (y) { return y.key === fresh[0]; })[0];
      party('انفتح إنجاز جديد!', (x ? x.title : '') + ' — شوفي وش كتب لك صالح 💌');
    }
  }
}

document.addEventListener('submit', async function (ev) {

      else {

      C.beans.unshift(bean || { id: 'local' + Date.now(), photo_path: ph.path, name: f.bname.value.trim() || null });

      var row = { user_id: Auth.uid(), bean_id: RD.bean || null, date: S.today, liked: RD.liked, notes: RD.notes.slice(),

      var saved = await store.addRating(row);
      setCheck('coffee', true);                         // بونص: مو من بنود السوارة، النسبة ما تتغير (ويفتح «أول وصفة قهوة»). بعد ما ينحفظ التقييم
      S.wins = null;
      C.ratings.unshift(saved || row); coffeeCache();
      brewStop(); renderCoffee(); window.scrollTo(0, 0); toast(row.liked ? 'حفظته! وبتطلع لك أكثر وصفات تشبهها ☕' : 'حفظته، المرة الجاية نجرب شي ثاني ☕');

function brewTime(f) {
  var r = currentRecipe(); if (!r) return;

  // الرقم اللي نقترحه للمرة الجاية يصير هو الافتراضي لهالوصفة
  LS.set('grind.' + r.id, clampGrind(B.advice === 'finer' ? B.grind - 1 : B.advice === 'coarser' ? B.grind + 1 : B.grind));

  renderCoffee();

}

/* ============================================================ اليوم الجديد (منتصف الليل / رجوع للتطبيق) */
async function refreshToday() {
  var t = computeToday();
  var changed = t !== S.today;
  if (changed) { S.today = t; S.checks = {}; S.msg = null; S.wins = null; touchedAt = {}; applyQueue(); }
  var gen = touchGen, day = S.today;
  try {
    var r = await Promise.all([store.checks(S.today, S.today), store.dailyMessage(S.today)]);
    if (S.today !== day) return;                       // اليوم تغيّر أثناء الطلب — التحديث الجديد يتكفل
    var c = {}; (r[0] || []).forEach(function (x) { c[x.key] = x.value; });
    // اللقطة من الخادم أقدم من أي تأشير صار أثناء الطلب: المحلي يغلب، والطابور يغلب
    var overrides = 0;
    Object.keys(touchedAt).forEach(function (k) { if (touchedAt[k] > gen) { c[k] = S.checks[k]; overrides++; } });
    S.checks = c; applyQueue();
    if (overrides || pendingCount()) queueDaily();     // النسبة من الحالة المدموجة
    S.msg = r[1] ? Object.assign({ date: S.today }, r[1]) : null;
    if (S.msg && !S.msg.seen_at) { S.msg.seen_at = new Date().toISOString(); store.markSeen(S.msg.id).catch(function () { S.msg.seen_at = null; }); }
    setOnline(true);
  } catch (e) {
    if (e instanceof AuthError) return sessionExpired();
    if (isOffline(e)) setOnline(false);
  }
  saveCache();
  if (route === 'today' && !isEmptySettings(S.settings) && !$('.party')) renderToday();
  flush();
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  if (B.phase === 'run') { if (B.lock && B.lock.released) B.lock = null; wakeLock(true); }   // المتصفح يفك القفل لما تنخفي الصفحة
  if (S.role) refreshToday();
});
setInterval(function () { if (S.role && computeToday() !== S.today) refreshToday(); }, 30000);
window.addEventListener('online', function () {

  if (!S.role) return;

});

/* ============================================================ الدخول */
/* الأرقام العربية/الفارسية (٠-٩ ۰-۹) → إنجليزية، عشان كيبورد عربي ما يخرّب كلمة المرور */
function latinDigits(v) {
  return String(v == null ? '' : v).replace(/[\u0660-\u0669]/g, function (d) { return String(d.charCodeAt(0) - 0x0660); })
    .replace(/[\u06F0-\u06F9]/g, function (d) { return String(d.charCodeAt(0) - 0x06F0); });
}
/* اسم المستخدم → إيميل داخلي: trim + lowercase، وبدون @ نضيف @jojo.invalid */
function usernameToEmail(u) {
  u = latinDigits(u).trim().toLowerCase();
  if (!u) return '';
  return u.indexOf('@') === -1 ? u + '@jojo.invalid' : u;
}
var tempPw = null;   // كلمة المرور المؤقتة بالذاكرة بس (للمقارنة)، تنمسح بعد التغيير أو الخروج
function showLogin(errMsg) {
  tempPw = null; S.role = null; S.synced = false; touchedAt = {}; S.notes = S.letters = S.wins = S.msg = null; S.tasks = []; S.checks = {}; S.settings = {};
  resetCoffee();
  $('#tabs').hidden = true; document.body.classList.add('bare');
  $('#view').innerHTML =
    '<section class="login"><form data-login novalidate>' + catSVG() + '<h1>هلا جوجو 🎀</h1><p class="lead">سجّلي دخولك عشان نكمل يومك سوا</p>' +
    '<label class="f" for="em">اسم المستخدم</label><input id="em" class="in" type="text" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr" required>' +
    '<label class="f" for="pw">كلمة المرور</label><input id="pw" class="in" type="password" name="password" autocomplete="current-password" dir="ltr" required>' +
    '<div class="actions"><button class="btn block" id="loginBtn">دخول</button></div>' +
    '<div id="loginErr" role="alert">' + (errMsg ? '<p class="alert">' + errMsg + '</p>' : '') + '</div></form></section>';
}
document.addEventListener('submit', async function (ev) {
  var f = ev.target; if (!f.hasAttribute('data-login')) return;
  ev.preventDefault();
  var email = usernameToEmail(f.username.value), pw = latinDigits(f.password.value), err = $('#loginErr'), btn = $('#loginBtn');
  if (!email || !pw) { err.innerHTML = '<p class="alert">اكتبي اسم المستخدم وكلمة المرور 🤍</p>'; return; }
  btn.disabled = true; btn.textContent = 'لحظة…'; err.innerHTML = '';
  try { await Auth.signIn(email, pw); tempPw = pw; await start(); }
  catch (e) {
    btn.disabled = false; btn.textContent = 'دخول';
    err.innerHTML = '<p class="alert">' + (isOffline(e) ? 'النت مقطوع، جربي لما يرجع' : e.message === 'email_not_confirmed' ? 'إيميلك لسه ما تأكد، افتحي رسالة التأكيد بإيميلك وبعدين ادخلي' : e.message === 'rate_limited' ? 'محاولات كثير ورا بعض، استني دقيقة وجربي' : e.message === 'bad_credentials' ? 'اسم المستخدم أو كلمة المرور غلط' : 'صار شي غلط، جربي بعد شوي') + '</p>';
  }
});
/* خطوة إجبارية بأول دخول: كلمة مرور خاصة فيها. ما تتخطى (ما فيه رجوع ولا تنقل) */
function showPwChange(errMsg) {
  S.role = null; S.synced = false;
  $('#tabs').hidden = true; document.body.classList.add('bare');
  $('#view').innerHTML =
    '<section class="login"><form data-pwchange novalidate>' + catSVG() + '<h1>اختاري كلمة مرور لك 🔒</h1><p class="lead">عشان نوتك الخاص يبقى لك بس — حتى صالح ما يعرفها.</p>' +
    '<label class="f" for="pw1">كلمة المرور الجديدة</label><input id="pw1" class="in" type="password" name="pw1" autocomplete="new-password" dir="ltr" minlength="6" required>' +
    '<label class="f" for="pw2">أكدي كلمة المرور</label><input id="pw2" class="in" type="password" name="pw2" autocomplete="new-password" dir="ltr" minlength="6" required>' +
    '<div class="actions"><button type="button" class="btn ghost small" data-act="pw-toggle" aria-pressed="false">إظهار</button></div>' +
    '<div class="actions"><button class="btn block" id="pwBtn">حفظ</button></div>' +
    '<div id="pwErr" role="alert">' + (errMsg ? '<p class="alert">' + errMsg + '</p>' : '') + '</div></form></section>';
}
document.addEventListener('click', function (ev) {
  var b = ev.target.closest && ev.target.closest('[data-act="pw-toggle"]'); if (!b) return;
  var show = b.getAttribute('aria-pressed') !== 'true';

  ['pw1', 'pw2'].forEach(function (id) { var i = document.getElementById(id); if (i) i.type = show ? 'text' : 'password'; });
});
document.addEventListener('submit', async function (ev) {
  var f = ev.target; if (!f.hasAttribute('data-pwchange')) return;
  ev.preventDefault();
  var a = latinDigits(f.pw1.value), b = latinDigits(f.pw2.value), err = $('#pwErr'), btn = $('#pwBtn');
  function bad(m) { err.innerHTML = '<p class="alert">' + m + '</p>'; }
  if (a.length < 6) return bad('كلمة المرور لازم تكون ٦ خانات أو أكثر 🤍');
  if (a !== b) return bad('الكلمتين مو متطابقتين، جربي مرة ثانية');
  if (tempPw !== null && a === tempPw) return bad('اختاري كلمة غير المؤقتة 🤍');
  btn.disabled = true; btn.textContent = 'لحظة…'; err.innerHTML = '';
  try { await Auth.setPassword(a); tempPw = null; await start(); }
  catch (e) {
    btn.disabled = false; btn.textContent = 'حفظ';
    if (e instanceof AuthError && e.message === 'expired') { await Auth.signOut(); return showLogin('انتهت الجلسة، سجّلي دخولك مرة ثانية 🤍'); }
    bad(isOffline(e) ? 'النت مقطوع، جربي لما يرجع' : e.message === 'same_password' ? 'اختاري كلمة غير المؤقتة 🤍' : e.message === 'weak_password' ? 'كلمة المرور ضعيفة، اختاري وحدة أقوى (٦ خانات أو أكثر)' : e.message === 'rate_limited' ? 'محاولات كثير، استني دقيقة وجربي' : 'صار شي غلط، جربي بعد شوي');
  }
});
async function sessionExpired() {
  await Auth.signOut();

/* ============================================================ التشغيل */
async function start() {
  if (!DEMO && Auth.mustChange()) return showPwChange();   // قبل أي شي: ما تتخطى
  $('#view').innerHTML = '<div class="loading" role="status">' + catSVG() + 'لحظة…</div>';
  var cached = !DEMO && loadCache();
  if (cached) { S.role = 'jojo'; go(); }
  return syncFromServer(cached, 0);
}
var bootTimer = null;
function stopBackground() {
  clearTimeout(bootTimer); bootTimer = null;
  clearTimeout(retryTimer); retryTimer = null;
  backoff = 0; retryToasted = false;
  memQueue = {};                             // طابور الذاكرة (لو localStorage مقفل) ما ينتقل لحساب ثاني
  pushRefreshed = false;
  brewStop();
}
async function syncFromServer(cached, attempt) {
  clearTimeout(bootTimer);
  if (!Auth.sess) return;                    // طلعت من حسابها: ما فيه شي نزامنه
  try {
    var p = await store.profile();
    if (!p || p.role !== 'jojo') {
      await Auth.signOut();
      return showLogin('هذا التطبيق لجوجو 🎀');
    }
    S.role = 'jojo'; S.settings = p.settings || {}; S.profileCreated = p.created_at;
    S.today = computeToday();
    S.tasks = await store.tasks() || [];
    S.synced = true;
    await refreshToday();
    go();
    refreshPush();
  } catch (e) {
    if (e instanceof AuthError) return sessionExpired();
    if (cached) {
      // نبقى على الكاش ونجرب مرة ثانية بتأخير متزايد (أو أول ما يرجع النت)
      if (isOffline(e)) setOnline(false);
      bootTimer = setTimeout(function () { syncFromServer(true, attempt + 1); }, Math.min(5000 * Math.pow(2, attempt), 300000));
      return;
    }
    $('#view').innerHTML = '<div class="loading" role="alert">' + catSVG() + '<p>' + (isOffline(e) ? 'النت مقطوع وما عندي نسخة محفوظة لسه. جربي لما يرجع النت.' : 'ما قدرت أفتح يومك، جربي بعد شوي.') + '</p><button class="btn small" onclick="location.reload()">جربي مرة ثانية</button></div>';
  }
}

function loadScript(src) {
  return new Promise(function (res, rej) {
    var sc = document.createElement('script');
    sc.src = src; sc.async = true; sc.onload = res; sc.onerror = rej;
    document.head.appendChild(sc);
  });
}
/* adhan (محلي، بدون أي سكربت خارجي) يتحمل بدون ما يوقف التشغيل؛ لو فشل تطلع أوقات الأذان "—" */
function loadAdhan() {
  loadScript('vendor/adhan.umd.min.js?v=' + V).then(function () {
    if (!window.adhan) return;
    Jojo.useAdhan(window.adhan);
    if (S.role && route === 'today' && !isEmptySettings(S.settings) && !$('.party')) renderToday();
  }).catch(function () { /* prayer cells stay "—" */ });
}
function boot() {
  if (!window.Jojo) { $('#view').innerHTML = '<p class="alert">ما قدرت أحمّل التطبيق، حدّثي الصفحة.</p>'; return; }
  loadAdhan();
  if (DEMO) {
    store = makeDemo(DEMO === 'onboard');
    Auth.sess = { access_token: 'demo', user: { id: 'demo' } };
    var hook = new URLSearchParams(location.search);
    if (hook.get('celebrate')) setTimeout(queenParty, 600);
    if (hook.get('toast')) setTimeout(function () { queenToast(); var t = $('.toast.queen'); if (t && hook.get('toast') === 'static') t.style.animation = 'none'; }, 600);
    return start();
  }
  store = Remote;
  if (Auth.load()) start(); else showLogin();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=' + encodeURIComponent(V)).catch(function () { /* ok without offline */ });
}
loadScript('core.js?v=' + V).then(boot, function () {
  $('#view').innerHTML = '<div class="loading" role="alert">' + catSVG() + '<p>ما قدرت أحمّل التطبيق، تأكدي من النت وحدّثي الصفحة.</p><button class="btn small" onclick="location.reload()">حدّثي</button></div>';
});
})();
