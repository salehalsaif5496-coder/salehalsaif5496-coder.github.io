<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141012">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="جوجو">
<title>جوجو</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/baloo-bhaijaan-2-arabic-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Baloo";src:url(fonts/baloo-bhaijaan-2-arabic-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Baloo";src:url(fonts/baloo-bhaijaan-2-arabic-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Baloo";src:url(fonts/baloo-bhaijaan-2-arabic-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Plex";src:url(fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Plex";src:url(fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Plex";src:url(fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
/* ---- الألوان والمقاسات: نفس النموذج المعتمد jojo/proto/today.html ---- */
:root{
  color-scheme:dark;
  --choc:#141012;      /* أسود دافي — الأرضية */
  --cream:#1F191C;     /* البطاقات */
  --card-2:#2A2226;    /* عناصر داخل البطاقات */
  --pink:#F4A7C0;      /* الوردي الأساسي */
  --pink-soft:#3A2630; /* أرضية وردية داكنة للسوارة */
  --rose:#F4A7C0;      /* لمسات وردية على الداكن (تباين 9:1) */
  --ink:#F6EEE3;       /* وايت شوكلت — النص */
  --ink-2:#C7B4B9;     /* نص ثانوي مايل للوردي (تباين 8:1) */
  --line:#33292D;
  --choc-deep:#C9AE8E; /* وايت شوكلت غامق — لمسات بسيطة */
  --on-pink:#1A1214;   /* نص فوق الوردي */
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --shadow:0 10px 28px -12px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.04) inset;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--choc);color:var(--ink);font-family:"Plex",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
::selection{background:var(--pink);color:var(--on-pink)}
body{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 18px) 18px 120px;max-width:440px;margin:0 auto}
body.bare{padding-bottom:40px}
h1,h2,h3,.num{font-family:"Baloo","Plex",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px;border-radius:12px}
#view:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* الترويسة */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.hello h1{font-size:28px;line-height:1.1;font-weight:800;text-wrap:balance}
.hello p{color:var(--ink-2);font-size:14px;margin-top:4px}
.top-end{display:flex;align-items:center;gap:6px;flex:none}
.cat{width:64px;height:64px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--choc-deep);background:var(--cream);border:1.5px solid var(--line)}
.icon-btn svg{width:22px;height:22px}
.page-top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.page-top h1{font-size:28px;font-weight:800;flex:1}

/* رسالة صالح — ظرف بفيونكة */
.letter{position:relative;background:var(--cream);border:1.5px solid #4A3D33;border-radius:var(--r-lg);padding:22px 20px 18px;box-shadow:var(--shadow);margin-bottom:22px}
.letter .bow{position:absolute;top:-16px;inset-inline-start:22px;width:46px;height:30px}
.letter .from{font-size:13px;color:var(--rose);font-weight:600;margin-bottom:6px}
.letter p{font-size:17px;line-height:1.7;color:var(--ink);white-space:pre-line}
.letter .sig{margin-top:10px;font-family:"Baloo";font-weight:700;color:var(--choc-deep);font-size:16px}
.letter.empty{border-style:dashed;border-color:var(--line);box-shadow:none}
.letter.empty p{font-size:15px;color:var(--ink-2)}

/* سوارة الالتزام */
.bracelet{background:var(--pink-soft);border-radius:var(--r-lg);padding:18px 18px 16px;margin-bottom:22px}
.bracelet-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.bracelet-head h2{font-size:18px;font-weight:700}
.bracelet-head .num{font-size:34px;font-weight:800;color:var(--rose);font-variant-numeric:tabular-nums}
.beads{--b:19px;display:flex;flex-wrap:nowrap;justify-content:space-between;gap:3px;align-items:center;position:relative;padding:6px 2px}
.beads::before{content:"";position:absolute;inset-inline:0;top:50%;height:2px;background:var(--choc-deep);opacity:.55;border-radius:2px}
.bead{position:relative;width:var(--b);height:var(--b);flex:none;border-radius:50%;background:var(--choc);border:2px solid #5A3B48;transition:background .3s var(--ease),border-color .3s}
.bead.on{background:radial-gradient(circle at 35% 30%,#FFE3EC 0 18%,var(--pink) 45%,#E98BAA 100%);border-color:#E98BAA}
.bead.charm{width:26px;height:26px;border:0;background:none}
.bracelet .hint{font-size:13px;color:var(--ink-2);margin-top:10px}

/* أقسام */
h2.sec{font-size:19px;font-weight:700;margin:4px 4px 10px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--choc-deep);flex:none}
h2.sec .badge{margin-inline-start:auto}
.group{background:var(--cream);border:1.5px solid var(--line);border-radius:var(--r-md);margin-bottom:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px;width:100%;text-align:start}
.row+.row,.sub+.row{border-top:1px solid var(--line)}
.row .ic{width:26px;height:26px;flex:none;color:var(--choc-deep)}
.row .t{flex:1;font-size:16px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--ink-2);font-weight:400}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid #5C4A50;display:grid;place-items:center;flex:none;transition:background .25s var(--ease),border-color .25s}
.tick svg{width:16px;height:16px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s var(--ease)}
.row.done .tick,.row[aria-pressed="true"] .tick{background:var(--pink);border-color:var(--pink)}
.row.done .tick svg,.row[aria-pressed="true"] .tick svg{opacity:1;transform:none}
.row[aria-pressed="true"] .t{color:var(--ink-2)}
button.row:active{background:var(--card-2)}

/* الصلوات */
.prayers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 14px 16px}
.pr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 4px;min-height:64px;border-radius:var(--r-sm);background:var(--card-2);font-size:13px;transition:background .25s var(--ease)}
.pr b{font-weight:600;font-size:14px}
.pr span{color:var(--choc-deep);font-variant-numeric:tabular-nums}
.pr[aria-pressed="true"]{background:var(--pink)}
.pr[aria-pressed="true"],.pr[aria-pressed="true"] b{color:var(--on-pink)}
.pr[aria-pressed="true"] span{color:#3A2630}
.pr.next:not([aria-pressed="true"]){outline:2px solid var(--rose);outline-offset:-2px;background:var(--cream)}
.pr-note{font-size:12px;color:var(--ink-2);padding:0 16px 12px}

/* الماء */
.cups{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));padding:0 6px 10px}
.cup-b{width:100%;height:48px;display:grid;place-items:center;border-radius:12px}
.cup{width:26px;height:32px}
.cup path{fill:var(--card-2);stroke:#5C4A50;stroke-width:2}
.cup path.w{fill:transparent;stroke:none}
.cup-b[aria-pressed="true"] path.w{fill:#8FC6E3}
.cup-b[aria-pressed="true"] path.o{stroke:#8FC6E3}

/* حبوب الفيتامين */
.sub{padding:4px 16px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;background:var(--card-2);border:1.5px solid #4A3D42;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:var(--on-pink);font-weight:600}
.chip .x{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.25)}

/* بطاقات وأزرار عامة */
.card{background:var(--cream);border:1.5px solid var(--line);border-radius:var(--r-md);padding:18px;margin-bottom:16px}
.card h3{font-size:18px;font-weight:700;margin-bottom:6px}
.muted{color:var(--ink-2);font-size:14px;line-height:1.7}
.btn{min-height:48px;padding:12px 22px;border-radius:999px;background:var(--pink);color:var(--on-pink);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid #4A3D42}
.btn.small{min-height:44px;padding:8px 16px;font-size:14px}
.link{color:var(--rose);text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;font-family:"Plex"}
.badge.private{background:var(--card-2);color:var(--choc-deep);border:1px solid #4A3D33}
.badge.shared{background:var(--pink-soft);color:var(--rose);border:1px solid #5A3B48}
label.f{display:block;font-size:14px;color:var(--ink-2);margin:14px 2px 6px}
.in,textarea.in,select.in{width:100%;min-height:48px;padding:12px 14px;border-radius:var(--r-sm);background:var(--card-2);border:1.5px solid #4A3D42;font-size:16px;color:var(--ink)}
textarea.in{min-height:110px;resize:vertical;line-height:1.7}
.in::placeholder{color:#9C8A90}
.in:focus{border-color:var(--rose);outline:none}
.in:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.form-row{display:flex;gap:10px}
.form-row>*{flex:1}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:48px;height:48px;border-radius:50%;background:var(--card-2);border:1.5px solid #4A3D42;font-size:24px;line-height:1}
.stepper .num{font-size:30px;font-weight:800;min-width:2ch;text-align:center;color:var(--rose)}

/* القوائم: مهام ونوت ورسائل */
.item{background:var(--cream);border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px}
.item .body{font-size:16px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.item .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.item .tools{display:flex;gap:4px}
.item .tools button{min-width:44px;min-height:44px;padding:0 10px;border-radius:12px;color:var(--ink-2);font-size:13px}
.item .tools button:hover{background:var(--card-2)}
.receipt{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.receipt.read{color:var(--rose)}
.days-s{font-size:13px;color:var(--choc-deep);margin-top:2px}
.empty{text-align:center;padding:26px 18px;border:1.5px dashed var(--line);border-radius:var(--r-md);color:var(--ink-2);font-size:15px;line-height:1.8;margin-bottom:16px}
.empty svg{width:64px;height:64px;display:block;margin:0 auto 8px}
.zone{border-radius:var(--r-lg);padding:16px 14px 6px;margin-bottom:22px}
.zone.private{background:#1A1517;border:1.5px solid var(--line)}
.zone.shared{background:linear-gradient(180deg,#2A1C23,#1F191C 70%);border:1.5px solid #5A3B48}
.zone>header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 4px 6px;flex-wrap:wrap}
.zone>header h2{font-size:20px;font-weight:800}
.zone>.who{font-size:13px;color:var(--ink-2);margin:0 4px 12px;line-height:1.6}

/* إنجازاتي */
.streaks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.streak{background:var(--cream);border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px}
.streak .num{font-size:30px;font-weight:800;color:var(--rose);line-height:1.1}
.streak .l{font-size:13px;color:var(--ink-2);margin-top:2px}
.win{display:flex;gap:12px;align-items:flex-start;background:var(--cream);border:1.5px solid var(--line);border-radius:var(--r-md);padding:16px;margin-bottom:12px}
.win .medal{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--card-2);font-size:22px}
.win.open{border-color:#5A3B48;background:linear-gradient(180deg,#2A1C23,var(--cream))}
.win.open .medal{background:var(--pink)}
.win h3{font-size:17px;font-weight:700}
.win .msg{margin-top:8px;padding:12px 14px;border-radius:var(--r-sm);background:var(--choc);border:1px solid #4A3D33;font-size:15px;line-height:1.75;white-space:pre-line}
.win .msg .sig{display:block;margin-top:6px;font-family:"Baloo";font-weight:700;color:var(--choc-deep)}
.bar{height:8px;border-radius:8px;background:var(--card-2);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);border-radius:8px}
.cat-hero{display:flex;align-items:center;gap:14px;background:var(--pink-soft);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:22px}
.cat-hero .cat{width:72px;height:72px}
.cat-hero.dance .cat{animation:hop 1.1s var(--ease) infinite}

/* قهوتي (قريبًا) */
.soon{text-align:center;padding:30px 22px;background:var(--cream);border:1.5px solid var(--line);border-radius:var(--r-lg)}
.soon svg{width:110px;height:110px;margin:0 auto 12px;display:block}
.soon h2{font-size:24px;font-weight:800;margin-bottom:8px}
.soon .tag{display:inline-block;margin-bottom:12px;padding:4px 14px;border-radius:999px;background:var(--pink-soft);color:var(--rose);font-weight:600;font-size:13px}

/* الدخول والإعداد */
.login{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;justify-content:center}
.login .cat{width:96px;height:96px;margin:0 auto 10px;display:block}
.login h1{font-size:32px;font-weight:800;text-align:center}
.login .lead{text-align:center;color:var(--ink-2);margin:6px 0 18px}
.alert{border-radius:var(--r-sm);padding:12px 14px;font-size:14px;line-height:1.6;margin-top:12px;background:#3A1F28;border:1px solid #6B3446;color:#FFD9E5}
.alert.soft{background:var(--card-2);border-color:#4A3D42;color:var(--ink)}

/* حالة: بدون نت، لحظة، رسالة */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 12px;border-radius:999px;background:var(--card-2);color:var(--ink-2);border:1px solid #4A3D42;margin-bottom:14px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--choc-deep)}
.loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:60px 0;color:var(--ink-2)}
.loading .cat{animation:breathe 1.6s ease-in-out infinite}
.toast{position:fixed;inset-inline:18px;bottom:calc(env(safe-area-inset-bottom) + 92px);max-width:404px;margin:0 auto;background:var(--ink);color:var(--choc);padding:12px 16px;border-radius:16px;font-size:15px;font-weight:500;box-shadow:var(--shadow);z-index:30;animation:rise .3s var(--ease)}
.heart{position:fixed;pointer-events:none;z-index:40;width:18px;height:18px;animation:float 900ms var(--ease) forwards}

/* الاحتفال */
.party{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(20,16,18,.86);backdrop-filter:blur(6px);padding:24px}
.party .box{text-align:center;max-width:340px}
.party .cat{width:140px;height:140px;display:block;margin:0 auto 10px;animation:hop 1s var(--ease) infinite}
.party h2{font-size:28px;font-weight:800;margin-bottom:6px}
.party p{color:var(--ink-2);margin-bottom:18px;line-height:1.7}
.party .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.party .confetti svg{position:absolute;top:-30px;width:20px;height:20px;animation:fall 2.6s linear infinite}

@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
@keyframes breathe{50%{transform:scale(1.06)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes float{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-60px) scale(1.2)}}
@keyframes fall{to{transform:translateY(110vh) rotate(260deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* شريط التنقل */
nav.tabs{position:fixed;inset-inline:0;bottom:0;padding:10px 8px calc(env(safe-area-inset-bottom) + 10px);background:rgba(20,16,18,.94);backdrop-filter:saturate(1.2) blur(8px);border-top:1.5px solid var(--line);z-index:20}
nav.tabs ul{display:flex;justify-content:space-around;list-style:none;max-width:440px;margin:0 auto}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--ink-2);text-decoration:none;padding:4px 10px;min-width:56px;min-height:48px;border-radius:14px}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current]{color:var(--rose);background:var(--pink-soft);font-weight:600}
.foot{font-size:12px;color:var(--ink-2);text-align:center;margin-top:8px}
</style>
</head>

<main id="view" tabindex="-1" aria-live="off"></main>

    <li><a href="#habits" data-tab="habits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>عاداتي</a></li>
    <li><a href="#coffee" data-tab="coffee"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h12v5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17M9 3c0 1.5 1 1.5 1 3M13 3c0 1.5 1 1.5 1 3"/></svg>قهوتي</a></li>
    <li><a href="#notes" data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M9 11h6M9 15h4"/></svg>نوتي</a></li>
    <li><a href="#wins" data-tab="wins"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4l-5.2 2.7 1-5.8L3.5 9.2l5.9-.9z"/></svg>إنجازاتي</a></li>

/* ============================================================ الجلسة (Supabase Auth عبر fetch، نفس نمط lab/index.html) */
function NetError(msg) { this.name = 'NetError'; this.message = msg || 'offline'; }
function HttpError(status, body) { this.name = 'HttpError'; this.status = status; this.message = body; }
function AuthError(msg) { this.name = 'AuthError'; this.message = msg; }

var Auth = {
  sess: null,
  load: function () { this.sess = LS.get('session', null); return !!(this.sess && this.sess.access_token); },
  save: function (s) {
    if (!s.expires_at) s.expires_at = Math.floor(Date.now() / 1000) + (s.expires_in || 3600);
    this.sess = s; LS.set('session', s);
  },
  uid: function () { return this.sess && this.sess.user && this.sess.user.id; },
  signIn: async function (email, password) {
    var r;
    try {
      r = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
        method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      });
    } catch (e) { throw new NetError(); }
    if (!r.ok) throw new AuthError(r.status === 400 ? 'bad_credentials' : 'auth_' + r.status);
    this.save(await r.json());
  },
  refresh: async function () {
    var r;
    try {
      r = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: this.sess.refresh_token })
      });
    } catch (e) { throw new NetError(); }
    if (!r.ok) throw new AuthError('expired');
    this.save(await r.json());
  },
  token: async function () {
    if (this.sess.expires_at && this.sess.expires_at - 60 < Date.now() / 1000) await this.refresh();
    return this.sess.access_token;
  },
  signOut: async function () {
    var s = this.sess; this.sess = null;
    LS.del('session'); LS.del('cache'); LS.del('queue');
    if (s && s.access_token && !DEMO) {
      try { await fetch(SB_URL + '/auth/v1/logout', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + s.access_token } }); } catch (e) { /* offline: the token just expires */ }
    }
  }
};

async function api(path, opt, retried) {
  opt = opt || {};
  var h = { apikey: SB_KEY, Authorization: 'Bearer ' + await Auth.token(), 'Content-Type': 'application/json' };
  if (opt.prefer) h.Prefer = opt.prefer;
  var r;
  try {
    r = await fetch(SB_URL + path, { method: opt.method || 'GET', headers: h, body: opt.body !== undefined ? JSON.stringify(opt.body) : undefined });
  } catch (e) { throw new NetError(); }
  if (r.status === 401 && !retried) { await Auth.refresh(); return api(path, opt, true); }
  if (!r.ok) throw new HttpError(r.status, await r.text());
  var t = await r.text(); return t ? JSON.parse(t) : null;
}
function q(v) { return encodeURIComponent(v); }

/* "upsert" بدون DO UPDATE على أعمدة المفتاح:
   صلاحيات الأعمدة في schema.sql تسمح بتحديث (value/pct, updated_at) بس، و upsert الافتراضي في PostgREST
   (resolution=merge-duplicates) يكتب SET لكل الأعمدة بما فيها user_id → يرفضه Postgres.
   فنسوي: insert ... on_conflict DO NOTHING ثم PATCH للقيمة. الاثنين idempotent — تكرار الرفع ما يكرر صفوف. */
async function upsertRow(table, row, conflictCols, patch, filter) {
  await api('/rest/v1/' + table + '?on_conflict=' + conflictCols, { method: 'POST', body: row, prefer: 'resolution=ignore-duplicates,return=minimal' });
  await api('/rest/v1/' + table + '?' + filter, { method: 'PATCH', body: patch, prefer: 'return=minimal' });
}

  ];

  function later(v) { return sleep(120).then(function () { return JSON.parse(JSON.stringify(v === undefined ? null : v)); }); }
  return {

var S = {

};
window.JojoApp = { state: S };

function computeToday() { return Jojo.localDate(new Date(), tz()); }
function items() { return Jojo.requiredItems(S.settings, tasksOn(S.today), S.today); }
function tasksOn(date) {
  return S.tasks.filter(function (t) { return !t.created_at || Jojo.localDate(new Date(t.created_at), tz()) <= date; });
}
function score() { return Jojo.dayScore(items(), S.checks, { waterGoal: S.settings.waterGoal }); }
function isEmptySettings(s) { return !s || Object.keys(s).length === 0; }

function saveCache() {
  LS.set('cache', { uid: Auth.uid(), settings: S.settings, tasks: S.tasks, today: S.today, checks: S.checks, msg: S.msg, profileCreated: S.profileCreated });
}
function loadCache() {

  S.today = computeToday();
  S.checks = c.today === S.today ? (c.checks || {}) : {};
  S.msg = c.msg && c.msg.date === S.today ? c.msg : null;

/* ============================================================ طابور التأشير بدون نت
   queue = { 'c|<date>|<key>': {t:'c', date, key, value, seq}, 'd|<date>': {t:'d', date, pct, seq} }
   مفتاح لكل بند → آخر قيمة بس، فإعادة الرفع ما تكرر شي. */
var flushing = false, retryTimer = null, seq = 0;
function queue() { return LS.get('queue', {}); }
function enqueue(entry) {
  var qd = queue(), id = entry.t === 'c' ? 'c|' + entry.date + '|' + entry.key : 'd|' + entry.date;
  entry.seq = Date.now() + '-' + (seq++);
  qd[id] = entry;
  if (!LS.set('queue', qd)) memQueue[id] = entry;   // لو localStorage مقفل، نخليه بالذاكرة
}
var memQueue = {};
function allQueued() { return Object.assign({}, queue(), memQueue); }
function applyQueue() {
  var qd = allQueued();
  Object.keys(qd).forEach(function (id) { var e = qd[id]; if (e.t === 'c' && e.date === S.today) S.checks[e.key] = e.value; });
}
function pendingCount() { return Object.keys(allQueued()).filter(function (k) { return k.charAt(0) === 'c'; }).length; }

async function flush() {
  if (flushing || !store) return;
  flushing = true;
  var failed = false, hadNet = true;
  try {
    var qd = allQueued();
    var ids = Object.keys(qd).sort(function (a, b) { return a.charAt(0) === b.charAt(0) ? 0 : a.charAt(0) === 'c' ? -1 : 1; }); // البنود قبل النسبة
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i], e = qd[id];
      try {
        if (e.t === 'c') await store.setCheck(e.date, e.key, e.value);
        else await store.setDaily(e.date, e.pct);
        var cur = queue();
        if (cur[id] && cur[id].seq === e.seq) { delete cur[id]; LS.set('queue', cur); }
        if (memQueue[id] && memQueue[id].seq === e.seq) delete memQueue[id];
      } catch (err) {
        if (err instanceof AuthError) { flushing = false; return sessionExpired(); }
        failed = true; hadNet = !(err instanceof NetError);
        break;
      }
    }
  } finally { flushing = false; }
  setOnline(!(failed && !hadNet));
  if (failed) {
    if (hadNet) toast('ما قدرت أحفظ، بجرب مرة ثانية');
    clearTimeout(retryTimer); retryTimer = setTimeout(flush, 15000);
  } else if (Object.keys(allQueued()).length) {
    setTimeout(flush, 0);                      // تأشيرات صارت أثناء الرفع → نكمل
  }
  if (route === 'today') updatePending();
}
function setOnline(v) {
  if (S.online === v) return;
  S.online = v;
  if (route === 'today') updatePending();
}
function updatePending() {
  var el = $('#pending'); if (!el) return;
  var n = pendingCount();
  if (!S.online) { el.hidden = false; el.innerHTML = '<i></i> بدون نت — تأشيراتك محفوظة عندك وبترتفع أول ما يرجع'; }
  else if (n) { el.hidden = false; el.innerHTML = '<i></i> أرفع ' + ar(n) + ' من تأشيراتك…'; }
  else el.hidden = true;
}

/* تأشير بند: تحديث فوري + طابور + رفع */
function setCheck(key, value, extra) {
  var before = score();
  S.checks[key] = value;
  enqueue({ t: 'c', date: S.today, key: key, value: value });
  (extra || []).forEach(function (x) { S.checks[x[0]] = x[1]; enqueue({ t: 'c', date: S.today, key: x[0], value: x[1] }); });
  queueDaily();
  saveCache();
  var after = score();
  if (route === 'today') renderToday();
  if (after === 100 && before !== 100) celebrateDay();
  flush();
}
function queueDaily() { enqueue({ t: 'd', date: S.today, pct: score() }); }

async function loadWins() {
  S.winsErr = false;
  try {
    var from = addDays(S.today, -59);
    var r = await Promise.all([store.checks(from, S.today), store.winMessages()]);
    var by = {};
    (r[0] || []).forEach(function (c) { (by[c.date] = by[c.date] || {})[c.key] = c.value; });
    by[S.today] = Object.assign({}, by[S.today] || {}, S.checks);            // اليوم: الحالة المحلية (فيها اللي بالطابور)
    var days = [];
    for (var d = from; d <= S.today; d = addDays(d, 1)) {
      days.push({ date: d, items: Jojo.requiredItems(S.settings, tasksOn(d), d), checks: by[d] || {}, waterGoal: S.settings.waterGoal });
    }
    var unlocked = Jojo.unlocked(days);
    // نحفظ اللي انفتح بالإعدادات عشان ما يتقفل بعد ما يطلع من نافذة الـ٦٠ يوم
    var kept = S.settings.wins || [];
    var all = kept.concat(unlocked.filter(function (k) { return kept.indexOf(k) === -1; }));
    if (all.length !== kept.length) { S.settings.wins = all; saveCache(); store.saveSettings(S.settings).catch(function () { /* next time */ }); }
    S.wins = { days: days, unlocked: all, msgs: r[1] || [] };
  } catch (e) {
    if (e instanceof AuthError) return sessionExpired();
    S.winsErr = true;
  }
  if (route === 'wins') renderWins();
}
function prayersStreak(days) {
  return Math.min.apply(null, PRAYERS.map(function (p) { return Jojo.streak(days, 'prayer:' + p[0]); }));
}
function renderWins() {
  var head = '<header class="page-top"><h1>إنجازاتي</h1></header>';

  if (!S.wins) { loadWins(); return paint(head + '<div class="loading" role="status">' + catSVG() + 'لحظة أحسب إنجازاتك…</div>'); }
  var w = S.wins, days = w.days, un = w.unlocked;
  var fullDays = days.filter(function (d) { return Jojo.dayScore(d.items, d.checks, { waterGoal: d.waterGoal }) === 100; }).length;
  var st = [
    [prayersStreak(days), 'الصلوات كاملة'],

    [Jojo.streak(days, 'wake'), 'صحيان بوقتي'],

  var gym = (S.settings.gymDays || []).length ? Jojo.streak(days, 'gym') : null;

  var cards = st.map(function (x) {
    return '<div class="streak"><div class="num">' + ar(x[0]) + '</div><div class="l">' + (x[0] === 0 ? 'ابدئي من اليوم' : (x[0] === 1 ? 'يوم' : x[0] === 2 ? 'يومين' : x[0] <= 10 ? 'أيام' : 'يوم') + ' ورا بعض') + ' · ' + x[1] + '</div></div>';
  }).join('') + (gym != null ? '<div class="streak"><div class="num">' + ar(gym) + '</div><div class="l">' + (gym === 1 ? 'حصة' : gym === 2 ? 'حصتين' : gym && gym <= 10 ? 'حصص' : 'حصة') + ' نادي ورا بعض</div></div>' : '');

  var msgOf = {};
  w.msgs.forEach(function (m) { if (!msgOf[m.achievement]) msgOf[m.achievement] = m; });
  var list = WINS.map(function (x) {
    var open = un.indexOf(x.key) !== -1, m = msgOf[x.key];

    var body = open

      : '<p class="muted">' + x.how + (m ? ' — ومعها رسالة من صالح 💌' : '') + '</p>' + prog;
    return '<article class="win' + (open ? ' open' : '') + '"><div class="medal" aria-hidden="true">' + (open ? x.medal : '🔒') + '</div><div style="flex:1;min-width:0"><h3>' + x.title + '</h3>' + body + '</div></article>';

    '<p class="muted">' + (fullDays ? 'سوارتك كملت فيها آخر ٦٠ يوم. كفو!' : 'إنجازاتك بتنفتح وحدة وحدة، وكل وحدة معها رسالة من صالح 🎀') + '</p></div></div>' +
    '<h2 class="sec">سلاسلي</h2><div class="streaks">' + cards + '</div>' +
    '<h2 class="sec">رسائل الإنجاز</h2>' + list

  // تعليم رسائل الإنجاز المفتوحة كمقروءة + احتفال بأي إنجاز جديد
  WINS.forEach(function (x) { var m = msgOf[x.key]; if (m && !m.seen_at && un.indexOf(x.key) !== -1) { m.seen_at = new Date().toISOString(); store.markSeen(m.id).catch(function () { m.seen_at = null; }); } });
  var seen = LS.get('seenWins', []);
  var fresh = un.filter(function (k) { return seen.indexOf(k) === -1; });
  if (fresh.length) {
    LS.set('seenWins', seen.concat(fresh));
    if (!/quiet/.test(location.search)) {
      var x = WINS.filter(function (y) { return y.key === fresh[0]; })[0];
      party('انفتح إنجاز جديد!', (x ? x.title : '') + ' — شوفي وش كتب لك صالح 💌');
    }
  }
}

document.addEventListener('click', function (ev) {

  var act = b.dataset.act;
  if (act === 'check') {
    var key = b.dataset.key, on = S.checks[key] === true;
    if (!on) heartAt(b);
    setCheck(key, !on);
  } else if (act === 'vit') {
    var v = b.dataset.v, vk = 'vit:' + v, nowOn = !(S.checks[vk] === true);
    if (nowOn) heartAt(b);

  } else if (act === 'water') {
    var n = +b.dataset.n, cur = typeof S.checks.water === 'number' ? S.checks.water : 0;
    var val = n === cur ? n - 1 : n;
    if (val > cur) heartAt(b);
    setCheck('water', val);
  } else if (act === 'settings') { location.hash = '#settings'; }
  else if (act === 'back') { draft = null; location.hash = '#today'; }
  else if (act === 'daychip') {
    var grp = b.dataset.group, dd = +b.dataset.d, arr = grp === 'gym' ? draft.gymDays : draftDays;

  } else if (act === 'rm-vit') { draft.vitamins.splice(+b.dataset.i, 1); keepForm(); renderSettings(isEmptySettings(S.settings)); }

    var bb = document.querySelector('[data-act="water-goal"][data-d="' + b.dataset.d + '"]'); if (bb) bb.focus();
  }
  else if (act === 'edit-task') { var t = S.tasks.filter(function (x) { return x.id === b.dataset.id; })[0]; editingTask = t.id; draftDays = (t.days || []).slice(); renderHabits(); var e = $('#et'); if (e) e.focus(); }
  else if (act === 'cancel-task') { editingTask = null; draftDays = []; renderHabits(); }
  else if (act === 'del-task') { delTask(b.dataset.id); }
  else if (act === 'edit-note') { editingNote = b.dataset.id; renderNotes(); var en = $('#en'); if (en) en.focus(); }
  else if (act === 'cancel-note') { editingNote = null; renderNotes(); }
  else if (act === 'del-note') { delItem('notes', b.dataset.id, store.deleteNote, 'تبين تحذفين هالنوت؟'); }
  else if (act === 'del-letter') { delItem('letters', b.dataset.id, store.deleteLetter, 'تبين تحذفين هالرسالة؟ لو صالح ما قراها، ما بيشوفها.'); }
  else if (act === 'retry-notes') { S.notesErr = false; S.notes = null; renderNotes(); }
  else if (act === 'retry-wins') { S.winsErr = false; S.wins = null; renderWins(); }
  else if (act === 'close-party') { var p = $('.party'); if (p) p.remove(); }
  else if (act === 'signout') { Auth.signOut().then(function () { location.hash = ''; showLogin(); }); }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') { var p = $('.party'); if (p) p.remove(); }
  if (ev.key === 'Enter' && ev.target.id === 'nv') { ev.preventDefault(); $('[data-act="add-vit"]').click(); }   // Enter يضيف الفيتامين بدل ما يحفظ الفورم
});
/* القيم المكتوبة بالفورم تبقى لما نعيد الرسم */
function keepForm() {
  var f = $('form[data-form="settings"]'); if (!f) return;
  draft.sleepAt = f.sleepAt.value; draft.wakeAt = f.wakeAt.value; draft.city = f.city.value;
}

document.addEventListener('submit', async function (ev) {
  var f = ev.target, kind = f.dataset.form; if (!kind) return;
  ev.preventDefault();
  if (kind === 'settings') return saveSettingsForm(f);
  var btn = f.querySelector('button:not([type="button"])'), label = btn.textContent;
  btn.disabled = true; btn.textContent = 'لحظة…';
  try {
    if (kind === 'add-task' || kind === 'edit-task') {
      var title = f.title.value.trim(); if (!title) throw 0;
      var days = draftDays.length && draftDays.length < 7 ? draftDays.slice().sort() : null;
      if (kind === 'add-task') { S.tasks.push(await store.addTask(title, days)); toast('أضفتها 🌸'); }
      else {
        await store.updateTask(f.dataset.id, { title: title, days: days });
        S.tasks.forEach(function (t) { if (t.id === f.dataset.id) { t.title = title; t.days = days; } });
        editingTask = null; toast('عدلتها 🤍');
      }
      draftDays = []; saveCache(); queueDaily(); flush(); S.wins = null; renderHabits();
    } else if (kind === 'add-note') {
      S.notes.unshift(await store.addNote(f.body.value.trim())); renderNotes(); toast('حفظت نوتك 🔒');
    } else if (kind === 'edit-note') {
      var upd = await store.updateNote(f.dataset.id, f.body.value.trim());
      S.notes = S.notes.map(function (n) { return n.id === f.dataset.id ? (upd || Object.assign(n, { body: f.body.value.trim() })) : n; });
      editingNote = null; renderNotes(); toast('عدلتها 🤍');
    } else if (kind === 'add-letter') {
      S.letters.unshift(await store.addLetter(f.body.value.trim())); renderNotes(); toast('وصلت لصالح 💌');
    }
  } catch (e) {
    if (e instanceof AuthError) return sessionExpired();
    btn.disabled = false; btn.textContent = label;
    if (e !== 0) toast(e instanceof NetError ? 'النت مقطوع، جربي لما يرجع' : 'ما قدرت أحفظ، جربي مرة ثانية');
  }
});
async function delTask(id) {
  if (!confirm('تبين تحذفين هالمهمة؟')) return;
  try {
    await store.deleteTask(id);
    S.tasks = S.tasks.filter(function (t) { return t.id !== id; });
    saveCache(); queueDaily(); flush(); S.wins = null; renderHabits(); toast('انحذفت');
  } catch (e) { if (e instanceof AuthError) return sessionExpired(); toast(e instanceof NetError ? 'النت مقطوع، جربي لما يرجع' : 'ما قدرت أحذفها، جربي مرة ثانية'); }
}
async function delItem(list, id, fn, ask) {
  if (!confirm(ask)) return;
  try {
    await fn(id);
    S[list] = S[list].filter(function (x) { return x.id !== id; }); renderNotes(); toast('انحذفت');
  } catch (e) { if (e instanceof AuthError) return sessionExpired(); toast(e instanceof NetError ? 'النت مقطوع، جربي لما يرجع' : 'ما قدرت أحذفها، جربي مرة ثانية'); }
}

/* ============================================================ اليوم الجديد (منتصف الليل / رجوع للتطبيق) */
async function refreshToday() {
  var t = computeToday();
  var changed = t !== S.today;
  if (changed) { S.today = t; S.checks = {}; S.msg = null; S.wins = null; applyQueue(); }
  try {
    var r = await Promise.all([store.checks(S.today, S.today), store.dailyMessage(S.today)]);
    var c = {}; (r[0] || []).forEach(function (x) { c[x.key] = x.value; });
    S.checks = c; applyQueue();
    S.msg = r[1] ? Object.assign({ date: S.today }, r[1]) : null;
    if (S.msg && !S.msg.seen_at) { S.msg.seen_at = new Date().toISOString(); store.markSeen(S.msg.id).catch(function () { S.msg.seen_at = null; }); }
    setOnline(true);
  } catch (e) {
    if (e instanceof AuthError) return sessionExpired();
    if (e instanceof NetError) setOnline(false);
  }
  saveCache();
  if (route === 'today' && !isEmptySettings(S.settings) && !$('.party')) renderToday();
  flush();
}
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && S.role) refreshToday(); });
setInterval(function () { if (S.role && computeToday() !== S.today) refreshToday(); }, 30000);
window.addEventListener('online', function () { setOnline(true); flush(); });
window.addEventListener('offline', function () { setOnline(false); });
window.addEventListener('hashchange', function () { if (S.role) { if (location.hash !== '#settings') draft = null; go(); } });

/* ============================================================ الدخول */
function showLogin(errMsg) {
  S.role = null; S.notes = S.letters = S.wins = S.msg = null; S.tasks = []; S.checks = {}; S.settings = {};
  $('#tabs').hidden = true; document.body.classList.add('bare');
  $('#view').innerHTML =
    '<section class="login"><form data-login novalidate>' + catSVG() + '<h1>هلا جوجو 🎀</h1><p class="lead">سجّلي دخولك عشان نكمل يومك سوا</p>' +
    '<label class="f" for="em">إيميلك</label><input id="em" class="in" type="email" name="email" autocomplete="username" inputmode="email" dir="ltr" required>' +
    '<label class="f" for="pw">كلمة المرور</label><input id="pw" class="in" type="password" name="password" autocomplete="current-password" dir="ltr" required>' +
    '<div class="actions"><button class="btn block" id="loginBtn">دخول</button></div>' +
    '<div id="loginErr" role="alert">' + (errMsg ? '<p class="alert">' + errMsg + '</p>' : '') + '</div></form></section>';
}
document.addEventListener('submit', async function (ev) {
  var f = ev.target; if (!f.hasAttribute('data-login')) return;
  ev.preventDefault();
  var email = f.email.value.trim(), pw = f.password.value, err = $('#loginErr'), btn = $('#loginBtn');
  if (!email || !pw) { err.innerHTML = '<p class="alert">اكتبي الإيميل وكلمة المرور 🤍</p>'; return; }
  btn.disabled = true; btn.textContent = 'لحظة…'; err.innerHTML = '';
  try { await Auth.signIn(email, pw); await start(); }
  catch (e) {
    btn.disabled = false; btn.textContent = 'دخول';
    err.innerHTML = '<p class="alert">' + (e instanceof NetError ? 'النت مقطوع، جربي لما يرجع' : e.message === 'bad_credentials' ? 'الإيميل أو كلمة المرور مو صحيحة، جربي مرة ثانية' : 'صار شي غلط، جربي بعد شوي') + '</p>';
  }
});
async function sessionExpired() {
  await Auth.signOut();
  showLogin('انتهت الجلسة، سجّلي دخولك مرة ثانية 🤍');
}

/* ============================================================ التشغيل */
async function start() {
  $('#view').innerHTML = '<div class="loading" role="status">' + catSVG() + 'لحظة…</div>';
  var cached = !DEMO && loadCache();
  if (cached) { S.role = 'jojo'; go(); }
  try {
    var p = await store.profile();
    if (!p || p.role !== 'jojo') {
      await Auth.signOut();
      return showLogin('هذا التطبيق لجوجو 🎀');
    }
    S.role = 'jojo'; S.settings = p.settings || {}; S.profileCreated = p.created_at;
    S.today = computeToday();
    S.tasks = await store.tasks() || [];
    await refreshToday();
    go();
  } catch (e) {
    if (e instanceof AuthError) return sessionExpired();
    if (cached) { setOnline(false); return; }
    $('#view').innerHTML = '<div class="loading" role="alert">' + catSVG() + '<p>' + (e instanceof NetError ? 'النت مقطوع وما عندي نسخة محفوظة لسه. جربي لما يرجع النت.' : 'ما قدرت أفتح يومك، جربي بعد شوي.') + '</p><button class="btn small" onclick="location.reload()">جربي مرة ثانية</button></div>';
  }
}

function boot() {
  if (!window.Jojo) { $('#view').innerHTML = '<p class="alert">ما قدرت أحمّل التطبيق، حدّثي الصفحة.</p>'; return; }
  if (window.adhan) Jojo.useAdhan(window.adhan);
  if (DEMO) {
    // تجربة فقط: لو ما وصلنا CDN (مثل بيئة الاختبار)، نجيب adhan من node_modules المحلي (ما ينرفع للموقع)
    if (!window.adhan) {
      var sc = document.createElement('script');
      sc.src = '../node_modules/adhan/lib/bundles/adhan.umd.min.js';
      sc.onload = function () { Jojo.useAdhan(window.adhan); if (route === 'today' && S.role) renderToday(); };
      document.head.appendChild(sc);
    }
    store = makeDemo(DEMO === 'onboard');
    Auth.sess = { access_token: 'demo', user: { id: 'demo' } };
    return start();
  }
  store = Remote;
  if (Auth.load()) start(); else showLogin();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* ok without offline */ });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
