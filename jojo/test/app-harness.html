<!doctype html><meta charset="utf-8"><body><pre id="out">RUNNING</pre><iframe id="f" style="width:390px;height:844px"></iframe>
<!-- Browser check for jojo/index.html against a mocked Supabase (no network). Serve repo root: python3 -m http.server 8765, then
     open http://localhost:8765/jojo/test/app-harness.html?role=jojo (or role=saleh) in Chrome and wait for "--- requests ---"
     (~15 s; headless puppeteer works too). Needs REAL time: --virtual-time-budget stalls the bean-photo decode (createImageBitmap). -->
<script>
var ROLE = new URLSearchParams(location.search).get('role') || 'jojo';
var MOCK = `<script>
(function(){
  var db = {checks:{}, daily:{}, msgSeen:null}; window.__db = db; window.__log = []; window.__offline = false;
  var today = null;
  function J(x){ return new Response(x===undefined?'':JSON.stringify(x), {status:200, headers:{'Content-Type':'application/json'}}); }
  function qs(u){ var o={}; u.split('?')[1].split('&').forEach(function(p){ var i=p.indexOf('='); o[decodeURIComponent(p.slice(0,i))]=decodeURIComponent(p.slice(i+1)); }); return o; }
  window.fetch = async function(url, opt){
    opt = opt||{}; var m = opt.method||'GET';
    if (window.__offline) throw new TypeError('Failed to fetch');
    if (url.indexOf('supabase.co')===-1) throw new TypeError('blocked');
    var raw = opt.body && typeof opt.body !== 'string' ? opt.body : null;
    var body = opt.body && !raw ? JSON.parse(opt.body) : null, h = opt.headers||{};
    window.__log.push(m+' '+url.split('.co')[1]+(h.Prefer?' ['+h.Prefer+']':'')+(body?' '+JSON.stringify(body):'')+(raw?' <'+(raw.type||'blob')+' '+raw.size+'B>':''));
    if (!h.apikey) return new Response('no apikey',{status:401});
    if (url.indexOf('/auth/v1/token?grant_type=password')!==-1) return J({access_token:'AT',refresh_token:'RT',expires_in:3600,user:{id:'U1'}});
    if (url.indexOf('/auth/v1/logout')!==-1) return J();
    if (h.Authorization!=='Bearer AT') return new Response('bad token',{status:401});
    var q = url.indexOf('?')!==-1 ? qs(url) : {};
    /* ---- قهوتي ---- */
    if (url.indexOf('/storage/v1/object/sign/jojo-beans')!==-1) return J((body.paths||[]).map(function(p){ return {path:p, signedURL:'/object/sign/jojo-beans/'+p+'?token=T', error:null}; }));
    if (url.indexOf('/storage/v1/object/jojo-beans/')!==-1 && m==='POST') {
      var bytes = new Uint8Array(await raw.arrayBuffer()), bmp = null;
      try { bmp = await createImageBitmap(raw); } catch(e) {}
      db.upload = {path:url.split('/object/jojo-beans/')[1], ctype:h['Content-Type'], upsert:h['x-upsert'], blobType:raw.type, size:raw.size, soi:bytes[0]===0xFF&&bytes[1]===0xD8, w:bmp&&bmp.width, h:bmp&&bmp.height};
      return J({Key:'jojo-beans/'+db.upload.path});
    }
    if (url.indexOf('jojo_recipes')!==-1) return J([
      {id:'hot-a',name:'صباحي الهادئ',style:'hot',roast:['medium'],dose:15,water:240,ice:0,temp_c:93,target_sec:180,grind_encore:15,steps:[{at_sec:0,pour_to_g:45,note:'بلّلي'},{at_sec:45,pour_to_g:240,note:'كملي'}],tastes:['حلو'],note:'x'},
      {id:'iced-b',name:'كراميل بارد',style:'iced',roast:['medium'],dose:20,water:180,ice:120,temp_c:92,target_sec:150,grind_encore:14,steps:[{at_sec:0,pour_to_g:45,note:'الثلج'},{at_sec:40,pour_to_g:180,note:'كملي'}],tastes:['حلو'],note:'y'}]);
    var BEAN_OK = ['user_id','photo_path','name','roaster'], RATING_OK = ['user_id','bean_id','date','liked','notes','brew_sec','grind'];
    function only(b, ok){ return Object.keys(b).every(function(k){ return ok.indexOf(k)!==-1; }); }
    if (url.indexOf('jojo_beans')!==-1) {
      if (m==='GET') return J(db.beans||[]);
      if (!only(body, BEAN_OK) || body.user_id!=='U1') return new Response('42501 bean cols',{status:403});
      db.beanInsert = body; var bean = Object.assign({id:'B1', created_at:new Date().toISOString()}, body); db.beans=[bean]; return J([bean]);
    }
    if (url.indexOf('jojo_ratings')!==-1) {
      if (m==='GET') return J([]);
      if (!only(body, RATING_OK) || body.user_id!=='U1') return new Response('42501 rating cols',{status:403});
      db.ratingInsert = body; return J([Object.assign({id:'R1', created_at:new Date().toISOString()}, body)]);
    }
    if (url.indexOf('jojo_profiles')!==-1) return J([{role:'${ROLE}', settings:{sleepAt:'23:00',wakeAt:'06:30',gymDays:[],vitamins:['د'],waterGoal:8,city:{id:'riyadh',name:'الرياض',lat:24.7136,lng:46.6753},tz:'Asia/Riyadh'}, created_at:'2026-01-01T00:00:00Z'}]);
    if (url.indexOf('jojo_tasks')!==-1) return J([]);
    if (url.indexOf('jojo_messages')!==-1) { if (m==='PATCH') { db.msgSeen = body; return J(); } return J(q.kind==='eq.daily'?[{id:'m1',body:'صباحك ورد',seen_at:null}]:[]); }
    if (url.indexOf('jojo_checks')!==-1) {
      if (m==='GET') return J(Object.keys(db.checks).map(function(k){ var p=k.split('|'); return {date:p[0],key:p[1],value:db.checks[k]}; }));
      if (m==='POST') { if (!/ignore-duplicates/.test(h.Prefer) || q.on_conflict!=='user_id,date,key') return new Response('bad upsert',{status:400}); var k=body.date+'|'+body.key; if(!(k in db.checks)) db.checks[k]=body.value; db.inserts=(db.inserts||0)+1; return J(); }
      if (m==='PATCH') { var ks=Object.keys(body).sort().join(','); if (ks!=='updated_at,value') return new Response('42501 column',{status:403}); db.checks[q.date.slice(3)+'|'+q.key.slice(3)] = body.value; return J(); }
    }
    if (url.indexOf('jojo_daily')!==-1) {
      if (m==='POST') { if(!(body.date in db.daily)) db.daily[body.date]=body.pct; return J(); }
      if (m==='PATCH') { var ks2=Object.keys(body).sort().join(','); if (ks2!=='pct,updated_at') return new Response('42501',{status:403}); db.daily[q.date.slice(3)] = body.pct; return J(); }
    }
    return new Response('unhandled '+url,{status:404});
  };
})();
<\/script>`;
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
var out = [];
function ok(c, label){ out.push((c?"PASS ":"FAIL ")+label); document.getElementById("out").textContent = out.join("\n"); }
(async function(){
  try { localStorage.clear(); } catch(e){}
  try {
  var html = await (await fetch('/jojo/index.html')).text();
  html = html.replace('<head>', '<head><base href="/jojo/">'+MOCK);
  out.push('fetched '+html.length); var f = document.getElementById('f'); f.srcdoc = html;
  await new Promise(function(r){ f.onload = r; });
  var w = f.contentWindow, d = f.contentDocument;
  if (!w.adhan) { /* CDN blocked in sandbox: load local copy for prayer times */ }
  await sleep(300);
  ok(!!d.querySelector('form[data-login]'), 'login screen shown with no session');
  d.getElementById('em').value='jojo@example.com'; d.getElementById('pw').value='x';
  d.querySelector('form[data-login]').requestSubmit();
  await sleep(800);
  if (ROLE !== 'jojo') {
    ok(/هذا التطبيق لجوجو/.test(d.body.textContent), 'non-jojo role sees "هذا التطبيق لجوجو"');
    ok(!w.localStorage.getItem('jojo.session'), 'non-jojo session signed out (cleared)');
    ok(w.__log.some(function(l){return /auth\/v1\/logout/.test(l)}), 'logout called');
  } else {
    ok(!!d.querySelector('.bracelet'), 'today rendered after login');
    ok(w.__db.msgSeen && w.__db.msgSeen.seen_at && Object.keys(w.__db.msgSeen).length===1, 'daily message marked seen (only seen_at)');
    function click(k){ d.querySelector('[data-key="'+k+'"]').click(); }
    click('prayer:fajr'); click('meal:breakfast'); click('sleep');
    await sleep(500);
    var S = w.JojoApp.state;
    ok(w.__db.checks[S.today+'|prayer:fajr']===true && w.__db.checks[S.today+'|sleep']===true, '3 ticks written to jojo_checks');
    w.__offline = true; w.dispatchEvent(new Event('offline'));
    click('wake'); await sleep(300);
    var qd = JSON.parse(w.localStorage.getItem('jojo.queue.U1')||'{}');
    ok(qd['c|'+S.today+'|wake'] && qd['c|'+S.today+'|wake'].value===true, 'offline tick queued in localStorage');
    ok(!(S.today+'|wake' in w.__db.checks), 'offline tick not on server yet');
    ok(/بدون نت/.test(d.getElementById('pending').textContent), 'offline pill shown');
    // the vitamin chip completes the vitamins item while offline too
    d.querySelector('[data-act="vit"]').click(); await sleep(200);
    w.__offline = false; w.dispatchEvent(new Event('online'));
    await sleep(1200);
    var items = w.Jojo.requiredItems(S.settings, S.tasks, S.today);
    var expect = w.Jojo.dayScore(items, S.checks, {waterGoal:S.settings.waterGoal});
    ok(w.__db.checks[S.today+'|wake']===true && w.__db.checks[S.today+'|vitamins']===true, 'queued ticks replayed after online');
    ok(w.__db.daily[S.today]===expect, 'jojo_daily.pct ('+w.__db.daily[S.today]+') == dayScore ('+expect+')');
    ok(Object.keys(JSON.parse(w.localStorage.getItem('jojo.queue.U1')||'{}')).length===0, 'queue empty after replay');
    // untick + replay twice → idempotent, value false
    click('sleep'); await sleep(500); 
    ok(w.__db.checks[S.today+'|sleep']===false, 'untick writes value=false');
    var keys = Object.keys(w.__db.checks).filter(function(k){return k.indexOf(S.today)===0});
    ok(keys.length === new Set(keys).size, 'no duplicate rows ('+keys.length+' keys)');
    ok(!w.__log.some(function(l){return /merge-duplicates/.test(l)}), 'never uses merge-duplicates (column grants)');

    // ---------------- قهوتي ----------------
    var pctBefore = w.__db.daily[S.today], itemsBefore = w.Jojo.requiredItems(S.settings, S.tasks, S.today).length;
    w.location.hash = '#coffee'; await sleep(800);
    ok(!!d.querySelector('.brew h2') && !!d.querySelector('#clock'), 'coffee tab: recipe of the day + timer rendered');
    ok(!/معتمد|ريز|Rays|Notion|المصدر/i.test(d.getElementById('view').textContent), 'coffee tab never mentions approval/Rays/Notion/source');
    // a 3000×2000 PNG → JPEG ≤1280 uploaded under her uid
    var cv = d.createElement('canvas'); cv.width = 3000; cv.height = 2000; var cx = cv.getContext('2d'); cx.fillStyle = '#c96'; cx.fillRect(0,0,3000,2000);
    var png = await new Promise(function(r){ cv.toBlob(r, 'image/png'); });
    var dt = new w.DataTransfer(); dt.items.add(new w.File([png], 'IMG_0001.png', {type:'image/png'}));
    var inp = d.getElementById('beanPhoto'); inp.files = dt.files; inp.dispatchEvent(new w.Event('change', {bubbles:true}));
    for (var tries = 0; tries < 40 && !d.querySelector('form[data-form="add-bean"]'); tries++) await sleep(200);
    ok(!!d.querySelector('form[data-form="add-bean"] img.preview'), 'photo preview + optional name form shown' + (d.querySelector('.toast') ? ' (toast: '+d.querySelector('.toast').textContent+')' : ''));
    d.getElementById('bn').value = 'إثيوبيا';
    d.querySelector('form[data-form="add-bean"]').requestSubmit(); await sleep(800);
    var up = w.__db.upload || {};
    ok(/^U1\/\d{13}\.jpg$/.test(up.path||''), 'upload path is <uid>/<timestamp>.jpg ('+up.path+')');
    ok(up.ctype==='image/jpeg' && up.blobType==='image/jpeg' && up.soi, 'upload body is JPEG (Content-Type + FF D8 header)');
    ok(up.w===1280 && up.h===853, 'resized to 1280px long edge ('+up.w+'x'+up.h+')');
    ok(up.upsert==='false', 'upload never overwrites (x-upsert: false)');
    var bi = w.__db.beanInsert || {};
    ok(bi.photo_path===up.path && bi.name==='إثيوبيا' && bi.user_id==='U1', 'jojo_beans insert {user_id, photo_path, name, roaster}');
    ok(d.querySelectorAll('.shelf figure.bean').length===1, 'bean shows on her shelf');
    // brew → time → advice → rating
    d.querySelector('[data-act="brew-start"]').click(); await sleep(1200);
    ok(/^0:0[1-2]$/.test(d.getElementById('clock').textContent) && d.querySelectorAll('.step.now').length===1, 'timer runs and highlights the current step');
    d.querySelector('[data-act="brew-finish"]').click(); await sleep(200);
    ok(d.getElementById('bm').value==='0' && +d.getElementById('bsx').value>=1, 'finish asks for the time, prefilled with elapsed');
    var rcp = w.document.querySelector('.brew h2').textContent;
    d.getElementById('bm').value = '1'; d.getElementById('bsx').value = '10';
    d.querySelector('form[data-form="brew-time"]').requestSubmit(); await sleep(300);
    ok(/نعّمي الطحنة رقم أو رقمين على Encore/.test(d.getElementById('advice').textContent), 'fast brew → "نعّمي الطحنة…" ('+rcp+')');
    d.querySelector('[data-act="rate-like"][data-v="1"]').click();
    d.querySelector('[data-act="rate-note"][data-v="حلو"]').click();
    d.querySelector('[data-act="rate-bean"]').click();
    d.querySelector('form[data-form="rate"]').requestSubmit(); await sleep(1200);
    var ri = w.__db.ratingInsert || {};
    ok(Object.keys(ri).sort().join(',')==='bean_id,brew_sec,date,grind,liked,notes,user_id', 'rating insert uses only granted columns ('+Object.keys(ri).join(',')+')');
    ok(ri.user_id==='U1' && ri.bean_id==='B1' && ri.date===S.today && ri.liked===true && ri.notes.join()==='حلو' && ri.brew_sec===70 && /^\d+$/.test(ri.grind), 'rating values: bean, date, liked, notes, brew_sec, grind');
    ok(w.__db.checks[S.today+'|coffee']===true, 'coffee check stored for today');
    ok(w.Jojo.requiredItems(S.settings, S.tasks, S.today).length===itemsBefore && !w.Jojo.requiredItems(S.settings, S.tasks, S.today).some(function(i){return i.key==='coffee'}), 'coffee is not a required item');
    ok(w.__db.daily[S.today]===pctBefore, 'coffee is bonus: jojo_daily.pct unchanged ('+pctBefore+' → '+w.__db.daily[S.today]+')');
    ok(/جربتي|قيّمي/.test(d.querySelector('[aria-label="ذوقي"]').textContent), 'ذوقي card rendered');
    // sign-out clears timers / memory queue
    w.location.hash = '#settings'; await sleep(300);
    d.querySelector('[data-act="signout"]').click(); await sleep(400);
    var n0 = w.__log.length; await sleep(6000);
    ok(!!d.querySelector('form[data-login]') && w.__log.length===n0, 'after sign-out: login shown, no background requests');
  }
  out.push('--- requests ---'); out = out.concat(w.__log);
  } catch(e) { out.push('ERROR '+e.stack); }
  document.getElementById('out').textContent = out.join('\n');
})();
</script>
