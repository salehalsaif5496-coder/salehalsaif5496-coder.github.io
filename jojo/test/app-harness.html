    pv(1,'at','0:45'); pv(1,'to','150');
    d.querySelector('[data-act="rf-pour-add"]').click(); await sleep(80);
    ok(rows().length===3 && rows()[0].querySelector('[data-p="at"]').value==='0:00' && rows()[0].querySelector('[data-p="note"]').value==='بلّلي القهوة', 'add pour keeps what was typed');
    pv(2,'at','0:30'); pv(2,'to','250');
    rform().requestSubmit(); await sleep(200);
    ok(rcpPosts().length===0 && !!d.getElementById('e-p2-at') && !!d.getElementById('e-p2-to') && /بعد اللي قبلها/.test(d.getElementById('e-p2-at').textContent) && /آخر صبّة لازم توصل لكمية الموية/.test(d.getElementById('e-p2-to').textContent), 'validation: time not increasing + last pour ≠ water → inline errors on that row');
    pv(2,'at','1:30'); pv(2,'to','256'); pv(1,'to','40');
    rform().requestSubmit(); await sleep(200);
    ok(rcpPosts().length===0 && /تزيد عن الصبّة اللي قبلها/.test(d.getElementById('e-p1-to').textContent), 'validation: amounts must increase');
    pv(1,'to','150'); d.querySelector('[data-act="rf-taste"][data-v="حلو"]').click();
    // offline: toast, form kept, nothing sent
    w.__offline = true; var n0 = w.__log.length;
    rform().requestSubmit(); await sleep(400);
    ok(/النت مقطوع/.test((d.querySelector('.toast')||{}).textContent||'') && rcpPosts().length===0 && !!rform() && d.querySelector('#rname').value==='قهوة الجمعة' && rows().length===3, 'offline save: toast, nothing posted, form still filled');
    w.__offline = false;
    rform().requestSubmit(); await sleep(700);
    var rp = rcpPosts();
    var body = w.__db.recipePosts && w.__db.recipePosts[0] || {};
    ok(rp.length===1 && !rform(), 'online save: one POST to jojo_recipes, form closed');
    ok(body.owner==='U1' && /^my-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(body.id||''), 'insert: owner = her uid, id = my-<uuid> ('+body.id+')');
    ok(Object.keys(body).sort().join(',')==='dose,grind_encore,ice,ice_cubes,id,name,note,owner,roast,steps,style,target_sec,tastes,temp_c,water', 'insert body has exactly the table columns ('+Object.keys(body).sort().join(',')+')');
    ok(body.name==='قهوة الجمعة' && body.style==='iced' && body.dose===16 && body.water===256 && body.ice===0 && body.ice_cubes==='٣ حبات بالسيرفر' && body.temp_c===92 && body.grind_encore===16 && body.target_sec===190 && body.tastes.join()==='حلو', 'insert values: numbers are numbers, target_sec = 190 seconds, ice_cubes text, ice 0');
    ok(JSON.stringify(body.steps)==='[{"at_sec":0,"pour_to_g":48,"note":"بلّلي القهوة"},{"at_sec":45,"pour_to_g":150,"note":""},{"at_sec":90,"pour_to_g":256,"note":""}]', 'insert steps shape [{at_sec, pour_to_g, note}] in seconds');
    var mineItem = d.querySelector('.lib-item[data-id="'+body.id+'"]');
    ok(!!mineItem && /وصفتك 🎀/.test(mineItem.textContent) && !!mineItem.querySelector('[data-act="rf-edit"]') && !!mineItem.querySelector('[data-act="rf-del"]') && d.querySelectorAll('.lib-item .badge.his').length===2, 'library: her recipe has وصفتك 🎀 badge + edit/delete; Saleh\'s rows still read-only');
    // edit: PATCH only her row, owner filter in URL, no id/owner in body
    mineItem.querySelector('[data-act="rf-edit"]').click(); await sleep(150);
    ok(d.querySelector('#rname').value==='قهوة الجمعة' && rows().length===3 && rows()[1].querySelector('[data-p="at"]').value==='0:45' && d.querySelector('[data-act="rf-style"][data-v="iced"]').getAttribute('aria-pressed')==='true' && d.getElementById('rfGrind').textContent==='١٦' && d.getElementById('rtarget').value==='3:10', 'edit form prefilled from the row (times back as m:ss)');
    setv('#rname', 'قهوة الجمعة ٢'); setv('#rtarget', '3:20');
    rform().requestSubmit(); await sleep(600);
    var pp = w.__db.recipePatches || [];
    ok(pp.length===1 && pp[0].url.split('.co')[1].indexOf('/rest/v1/jojo_recipes?id=eq.'+body.id+'&owner=eq.U1&')===0 && pp[0].body.name==='قهوة الجمعة ٢' && pp[0].body.target_sec===200 && pp[0].body.owner===undefined && pp[0].body.id===undefined, 'edit: PATCH ?id=eq.<hers>&owner=eq.U1, body without id/owner');
    ok(!w.__log.some(function(l){ return /^(PATCH|DELETE) .*jojo_recipes.*id=eq\.(hot-a|iced-mine)/.test(l); }), 'never PATCH/DELETE Saleh\'s recipes');
    // default: settings.coffeeDefault, merged with her other settings
    d.querySelector('.lib-item[data-id="'+body.id+'"] [data-act="rf-default"]').click(); await sleep(600);
    var prp = (w.__db.profilePatches||[]).slice(-1)[0] || {};
    ok(prp.body && prp.body.settings && prp.body.settings.coffeeDefault===body.id && prp.body.settings.sleepAt==='23:00' && prp.body.settings.waterGoal===8, 'اعتمديها: PATCH jojo_profiles settings.coffeeDefault = her id (other settings kept)');
    ok(d.querySelector('.brew h2').textContent==='قهوة الجمعة ٢' && /الافتراضية/.test(d.querySelector('.lib-item[data-id="'+body.id+'"]').textContent), 'recipe of the day = her default; marked الافتراضية');
    // tapping Saleh's recipe overrides today only; the default stays
    d.querySelector('.lib-item[data-id="hot-a"] [data-act="lib-pick"]').click(); await sleep(200);
    ok(d.querySelector('.brew h2').textContent==='صباحي الهادئ' && /من صالح 🤍/.test(d.querySelector('.brew .mk').textContent) && w.JojoApp.state.settings.coffeeDefault===body.id, 'tap a library recipe → it is today\'s recipe; default unchanged');
    w.location.hash = '#today'; await sleep(200); w.location.hash = '#coffee'; await sleep(300);
    ok(d.querySelector('.brew h2').textContent==='صباحي الهادئ', 'today\'s pick survives navigation (overrides the default for today)');
    // iced recipe from Saleh with ice_cubes: no النسبة, shows الثلج: text
    d.querySelector('.lib-item[data-id="iced-mine"] [data-act="lib-pick"]').click(); await sleep(200);
    var spx = d.querySelector('.specs').textContent;
    ok(/الثلج: ٤ حبات بالسيرفر \+ ٤ بالكوب/.test(spx) && !/النسبة/.test(spx) && !/جم\s*ثلج/.test(spx), 'iced + ice_cubes: card shows "الثلج: <text>", no النسبة, no grams');
    ok(/الثلج: ٤ حبات/.test(d.querySelector('.timer').textContent), 'iced timer hint shows ice_cubes');
    // delete: confirm first
    var asked = []; w.confirm = function(m){ asked.push(m); return false; };
    d.querySelector('.lib-item[data-id="'+body.id+'"] [data-act="rf-del"]').click(); await sleep(300);
    ok(asked.join()==='متأكدة تحذفينها؟' && !(w.__db.recipeDeletes||[]).length && !!d.querySelector('.lib-item[data-id="'+body.id+'"]'), 'delete: asks "متأكدة تحذفينها؟", cancel sends nothing');
    w.confirm = function(m){ asked.push(m); return true; };
    d.querySelector('.lib-item[data-id="'+body.id+'"] [data-act="rf-del"]').click(); await sleep(700);
    var dl = w.__db.recipeDeletes || [];
    ok(dl.length===1 && dl[0].split('.co')[1]==='/rest/v1/jojo_recipes?id=eq.'+body.id+'&owner=eq.U1' && !d.querySelector('.lib-item[data-id="'+body.id+'"]'), 'delete confirmed: DELETE ?id=eq.<hers>&owner=eq.U1, row gone from the library');
    var prp2 = (w.__db.profilePatches||[]).slice(-1)[0] || {};
    ok(prp2.body && prp2.body.settings && prp2.body.settings.coffeeDefault===undefined && prp2.body.settings.sleepAt==='23:00', 'deleting the default also clears settings.coffeeDefault');
    ok(!/معتمد|ريز|Rays|Notion|المصدر/i.test(d.getElementById('view').textContent), 'coffee tab still never mentions approval/Rays/Notion/source');
    w.location.hash = '#coffee'; await sleep(100);
    // sign-out clears timers / memory queue
    w.location.hash = '#settings'; await sleep(300);
    ok(d.querySelector('.see-line') && d.querySelector('.see-line').textContent === SEE, 'transparency line shown in settings');
    d.querySelector('[data-act="signout"]').click(); await sleep(400);
    var n0 = w.__log.length; await sleep(6000);
    ok(!!d.querySelector('form[data-login]') && w.__log.length===n0, 'after sign-out: login shown, no background requests');
  }
  out.push('--- requests ---'); out = out.concat(w.__log);
  } catch(e) { out.push('ERROR '+e.stack); }
  document.getElementById('out').textContent = out.join('\n');
})();
</script>
