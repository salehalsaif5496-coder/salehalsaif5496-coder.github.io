    ok(/انتهت الجلسة/.test(d.body.textContent) && !!d.querySelector('form[data-login]') && db.refreshed === r0 + 1 && !w.localStorage.getItem('jojo-saleh.session'), '401 right after a successful refresh -> login "انتهت الجلسة" (not a stuck error)');
  }
  out.push('--- requests ---'); out = out.concat(w.__log); document.getElementById('out').textContent = out.join('\n');
  } catch (e) { out.push('ERROR ' + e.message + '\n' + e.stack); document.getElementById('out').textContent = out.join('\n'); }
})();
